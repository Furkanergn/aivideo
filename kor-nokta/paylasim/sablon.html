<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>Kör Nokta — kapak ve hikaye şablonu</title>
<link rel="stylesheet" href="../assets/kn.css" />
<style>
  @font-face { font-family: "KN Metin"; src: url("../assets/fonts/poppins-latin-600-normal.woff2") format("woff2"); font-weight: 600; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "KN Metin"; src: url("../assets/fonts/poppins-latin-ext-600-normal.woff2") format("woff2"); font-weight: 600; unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #05070c; overflow: hidden; }
  #tuval { position: relative; width: 1080px; overflow: hidden; background: #05070c; }
  #resim { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 50% 0%; }
  #resim img { display: block; width: 1080px; height: 1920px; }
  #resim svg { position: absolute; left: 0; top: 0; }
  #golge { position: absolute; left: 0; bottom: 0; width: 1080px; }
  .blok { position: absolute; font-family: "KN Baslik", sans-serif; line-height: 1; white-space: nowrap; letter-spacing: 0.01em; }
  .koyu { background: #05070c; color: #efe6d2; }
  .acik { background: #f2a516; color: #05070c; }
  .nokta { display: inline-block; width: 0.6em; height: 0.6em; border-radius: 50%; background: #05070c; margin: 0 0.035em 0 0.03em; vertical-align: 0.04em; }
  #rozet { border-radius: 8px; box-shadow: 0 6px 0 rgba(5, 7, 12, 0.35); }
  #alt { position: absolute; font-family: "KN Metin", sans-serif; font-weight: 600; color: #efe6d2; line-height: 1.3; text-shadow: 0 2px 10px rgba(5, 7, 12, 0.9); }
  #alt.cubuk { border-left: 7px solid #f2a516; padding-left: 20px; }
</style>
</head>
<body>
<div id="tuval">
  <div id="resim"><img id="img" alt="" /><svg id="ibre" width="1080" height="1920" viewBox="0 0 1080 1920"></svg></div>
  <div id="golge"></div>
  <div class="blok acik" id="rozet"></div>
  <div class="blok koyu" id="b1"></div>
  <div class="blok koyu" id="b2"></div>
  <div class="blok acik" id="b3"></div>
  <div id="alt"></div>
</div>
<script>
  // Parametreler: tur=kapak|kapak45|hikaye, bolum, resim, alt, y (resim kaydırma), olcek, ibre=cx,cy,akrep,yelkovan,saniye,boy
  const q = new URLSearchParams(location.search), tur = q.get("tur") || "kapak", bolum = q.get("bolum") || "1";
  const el = (id) => document.getElementById(id), koy = (id, s) => Object.assign(el(id).style, s);
  const Y = tur === "kapak45" ? 1350 : 1920;
  koy("tuval", { height: Y + "px" });
  el("img").src = "../assets/paneller/" + q.get("resim");
  koy("resim", { transform: `translateY(${q.get("y") || 0}px) scale(${q.get("olcek") || 1})` });
  if (q.get("ibre")) {
    const [cx, cy, a, y, s, boy] = q.get("ibre").split(",").map(Number);
    const cizgi = (aci, uzun, kalin, renk) => `<path d="M${cx} ${cy} L${cx} ${cy - uzun}" stroke="${renk}" stroke-width="${kalin}" stroke-linecap="round" transform="rotate(${aci} ${cx} ${cy})" />`;
    el("ibre").innerHTML = cizgi(a, boy * 0.62, boy * 0.06, "#05070c") + cizgi(y, boy * 0.92, boy * 0.04, "#05070c") + cizgi(s, boy, boy * 0.018, "#f2a516") + `<circle cx="${cx}" cy="${cy}" r="${boy * 0.055}" fill="#05070c" />`;
  }
  const NOKTA = 'N<span class="nokta"></span>KTA';
  if (tur === "hikaye") {
    koy("golge", { height: "1100px", background: "linear-gradient(rgba(5,7,12,0) 0%, rgba(5,7,12,0.88) 42%, #05070c 70%)" });
    el("rozet").style.display = "none";
    el("b1").textContent = "KÖR NOKTA"; koy("b1", { left: "176px", top: "930px", fontSize: "72px", padding: "14px 30px 8px", transform: "rotate(-2deg)" });
    el("b2").textContent = "BÖLÜM " + bolum; koy("b2", { left: "128px", top: "1022px", fontSize: "212px", padding: "22px 46px 6px", transform: "rotate(-2deg)" });
    el("b3").textContent = "YAYINDA!"; koy("b3", { left: "84px", top: "1262px", fontSize: "238px", padding: "22px 50px 4px", transform: "rotate(1.5deg)" });
    el("alt").textContent = q.get("alt") || ""; koy("alt", { left: "0", width: "1080px", top: "1582px", fontSize: "40px", textAlign: "center" });
  } else {
    const k = tur === "kapak45";
    koy("golge", { height: (k ? 900 : 1150) + "px", background: "linear-gradient(rgba(5,7,12,0) 0%, rgba(5,7,12,0.72) 55%, rgba(5,7,12,0.94) 100%)" });
    el("rozet").textContent = "BÖLÜM " + bolum; koy("rozet", { left: "72px", top: (k ? 62 : 330) + "px", fontSize: "56px", padding: "14px 26px 6px" });
    el("b1").textContent = "KÖR"; koy("b1", { left: "72px", top: (k ? 760 : 1076) + "px", fontSize: (k ? 150 : 160) + "px", padding: "18px 38px 4px", transform: "rotate(-3deg)" });
    el("b2").style.display = "none";
    el("b3").innerHTML = NOKTA; koy("b3", { left: "128px", top: (k ? 918 : 1244) + "px", fontSize: (k ? 240 : 262) + "px", padding: "24px 50px 2px", transform: "rotate(2deg)" });
    el("alt").className = "cubuk"; el("alt").innerHTML = q.get("alt") || ""; koy("alt", { left: "72px", top: (k ? 1234 : 1606) + "px", fontSize: (k ? 34 : 38) + "px", width: "940px" });
  }
</script>
</body>
</html>
