<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>Kör Nokta — tuğla oyuncak dünyası denemesi</title>
<link rel="stylesheet" href="../assets/kn.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0f1a2e; }
  canvas { position: absolute; left: 0; top: 0; }
  .y { position: absolute; color: #efe6d2; }
  #etiket { left: 60px; top: 196px; font-family: var(--kn-dosya); font-weight: 700; font-size: 30px; letter-spacing: 0.06em; }
  #baslik { left: 0; width: 1080px; top: 262px; text-align: center; font-family: var(--kn-baslik); font-size: 170px; line-height: 1.15; letter-spacing: 0.02em; white-space: nowrap; }
  #baslik i { display: inline-block; width: 104px; height: 104px; border-radius: 50%; background: #f2a516; margin: 0 8px 0 6px; vertical-align: -2px; box-shadow: inset -10px -12px 0 rgba(0, 0, 0, 0.18); }
  #bolum { left: 0; width: 1080px; top: 478px; text-align: center; font-family: var(--kn-dosya); font-weight: 700; font-size: 38px; color: #f2a516; letter-spacing: 0.08em; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="y" id="etiket">@BFStudiosAI</div>
<div class="y" id="baslik">KÖR N<i></i>KTA</div>
<div class="y" id="bolum">BÖLÜM 1 · DURAN SAAT</div>
<script type="module">
  import * as THREE from "../assets/vendor/three.module.js";
  window.__hazir = false;
  function tohum(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const r = tohum(250);
  await document.fonts.load('200px "KN Baslik"');

  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(1080, 1920, false);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.95;
  const scene = new THREE.Scene(); scene.background = new THREE.Color("#0f1a2e");
  const cam = new THREE.PerspectiveCamera(28, 1080 / 1920, 1, 300);
  cam.position.set(38, 27, 66); cam.lookAt(5.2, 13.6, 5);

  scene.add(new THREE.HemisphereLight("#8aa0d0", "#141c30", 1.1));
  const gunes = new THREE.DirectionalLight("#fff1dc", 1.7);
  gunes.position.set(18, 30, 28); gunes.target.position.set(6, 6, 4); gunes.castShadow = true;
  gunes.shadow.mapSize.set(1024, 1024); Object.assign(gunes.shadow.camera, { left: -22, right: 22, top: 26, bottom: -8, near: 1, far: 90 }); gunes.shadow.bias = -0.0015;
  scene.add(gunes, gunes.target);

  const H = 1.2, mats = {};
  const mat = (c, o = {}) => (mats[c + JSON.stringify(o)] ||= new THREE.MeshStandardMaterial({ color: c, roughness: 0.32, metalness: 0, ...o }));
  const studs = [];
  function kutu(x, y, z, w, h, d, c, o) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c, o)); m.position.set(x + w / 2, y + h / 2, z + d / 2); m.castShadow = m.receiveShadow = true; scene.add(m); return m; }
  function tugla(x, y, z, w, d, c, h = H, cikinti = true) {
    kutu(x + 0.03, y, z + 0.03, w - 0.06, h - 0.03, d - 0.06, c);
    if (cikinti) for (let i = 0; i < w; i++) for (let j = 0; j < d; j++) studs.push([x + i + 0.5, y + h + 0.06, z + j + 0.5, c]);
  }

  // zemin plakası
  tugla(-4, -0.4, -2, 21, 17, "#27375a", 0.4);
  // kaldırım
  tugla(-2, 0, 6, 17, 3, "#3a5480", 0.4);

  // dükkan cephesi: 12 genişlik, 16 sıra
  const bos = (x, s) => (x >= 4 && x < 8 && s <= 4) || (s >= 7 && s <= 9 && ((x >= 2 && x < 4) || (x >= 8 && x < 10))) || (s >= 11 && s <= 14 && x >= 4 && x < 8);
  for (let s = 0; s < 16; s++) {
    let x = 0;
    while (x < 12) {
      if (bos(x, s)) { x++; continue; }
      let w = 1; const sinir = s % 2 ? 4 : 2;
      while (x + w < 12 && !bos(x + w, s) && w < 4 && (x + w) % 4 !== (s % 2 ? 2 : 0)) w++;
      const c = s === 5 || s === 15 || s === 10 ? "#1d3052" : r() > 0.82 ? "#d6c7a6" : "#efe6d2";
      tugla(x, s * H, 4, w, 2, c, H, s === 15 || bos(x, s + 1) || bos(x + w - 1, s + 1));
      x += w;
    }
  }
  // kapı (aralık, içeriden ışık) ve pencereler
  kutu(4, 0, 5.2, 4, 5 * H, 0.2, "#f2a516", { emissive: "#f2a516", emissiveIntensity: 0.9 });
  kutu(4, 0, 5.9, 1.7, 5 * H, 0.25, "#8a4f1d").rotation.y = 0.5;
  kutu(8, 7 * H, 5.2, 2, 3 * H, 0.2, "#f2a516", { emissive: "#f2a516", emissiveIntensity: 1.3 });
  kutu(2, 7 * H, 5.2, 2, 3 * H, 0.2, "#3a5480", { roughness: 0.1 });
  const kapiIsik = new THREE.PointLight("#f2a516", 60, 22, 1.6); kapiIsik.position.set(6, 3, 8.5); scene.add(kapiIsik);

  // tabela
  const tc = document.createElement("canvas"); tc.width = 1024; tc.height = 160; const tx = tc.getContext("2d");
  tx.fillStyle = "#05070c"; tx.fillRect(0, 0, 1024, 160); tx.fillStyle = "#f2a516"; tx.font = '116px "KN Baslik"'; tx.textAlign = "center"; tx.textBaseline = "middle"; tx.fillText("ANTİKACI", 512, 86);
  const tt = new THREE.CanvasTexture(tc); tt.colorSpace = THREE.SRGBColorSpace; tt.anisotropy = 8;
  const tabela = new THREE.Mesh(new THREE.BoxGeometry(9.6, 1.5, 0.3), [mat("#05070c"), mat("#05070c"), mat("#05070c"), mat("#05070c"), new THREE.MeshStandardMaterial({ map: tt, roughness: 0.4 }), mat("#05070c")]);
  tabela.position.set(6, 5 * H + 0.62, 6.2); tabela.castShadow = true; scene.add(tabela);

  // cephe saati: 02.50'de durmuş
  const sc = document.createElement("canvas"); sc.width = sc.height = 512; const sx = sc.getContext("2d");
  sx.fillStyle = "#efe6d2"; sx.beginPath(); sx.arc(256, 256, 256, 0, 7); sx.fill(); sx.strokeStyle = "#05070c"; sx.lineCap = "round";
  for (let i = 0; i < 12; i++) { const t = (i * Math.PI) / 6; sx.lineWidth = i % 3 ? 10 : 18; sx.beginPath(); sx.moveTo(256 + Math.sin(t) * 196, 256 - Math.cos(t) * 196); sx.lineTo(256 + Math.sin(t) * 228, 256 - Math.cos(t) * 228); sx.stroke(); }
  const ib = (derece, boy, k) => { const t = (derece * Math.PI) / 180; sx.lineWidth = k; sx.beginPath(); sx.moveTo(256, 256); sx.lineTo(256 + Math.sin(t) * boy, 256 - Math.cos(t) * boy); sx.stroke(); };
  ib(85, 120, 26); ib(300, 180, 16); sx.fillStyle = "#05070c"; sx.beginPath(); sx.arc(256, 256, 22, 0, 7); sx.fill();
  const st = new THREE.CanvasTexture(sc); st.colorSpace = THREE.SRGBColorSpace; st.anisotropy = 8;
  const cerceve = new THREE.Mesh(new THREE.CylinderGeometry(2.25, 2.25, 0.7, 48), mat("#f2a516")); cerceve.rotation.x = Math.PI / 2; cerceve.position.set(6, 12.6 * H + 0.4, 5.6); cerceve.castShadow = true; scene.add(cerceve);
  const kadran = new THREE.Mesh(new THREE.CircleGeometry(1.85, 48), new THREE.MeshStandardMaterial({ map: st, roughness: 0.5 })); kadran.position.set(6, 12.6 * H + 0.4, 5.97); scene.add(kadran);

  // sokak lambası
  const silindir = (x, y, z, rr, h, c, o) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(rr, rr, h, 20), mat(c, o)); m.position.set(x, y + h / 2, z); m.castShadow = true; scene.add(m); return m; };
  tugla(-2, 0.4, 7, 2, 2, "#05070c", 0.4, false); silindir(-1, 0.8, 8, 0.28, 9.4, "#05070c"); kutu(-1.3, 10.2, 7.7, 2.6, 0.5, 0.6, "#05070c");
  const ampul = new THREE.Mesh(new THREE.SphereGeometry(0.62, 24, 16), mat("#f2a516", { emissive: "#f2a516", emissiveIntensity: 2.4 })); ampul.position.set(0.9, 9.75, 8); scene.add(ampul);
  const lamba = new THREE.PointLight("#f2a516", 110, 30, 1.6); lamba.position.set(0.9, 9.4, 8.6); scene.add(lamba);

  // genel blok figür (markasız)
  function figur(x, z, o) {
    const g = new THREE.Group(), ekle = (geo, c, px, py, pz, extra) => { const m = new THREE.Mesh(geo, mat(c, extra)); m.position.set(px, py, pz); m.castShadow = true; g.add(m); return m; };
    ekle(new THREE.BoxGeometry(0.55, 1.3, 0.7), o.bacak, -0.33, 0.65, 0); ekle(new THREE.BoxGeometry(0.55, 1.3, 0.7), o.bacak, 0.33, 0.65, 0);
    ekle(new THREE.BoxGeometry(1.5, 1.5, 0.85), o.govde, 0, 2.05, 0);
    if (o.etek) ekle(new THREE.BoxGeometry(1.6, 1.0, 0.95), o.govde, 0, 1.1, 0);
    ekle(new THREE.BoxGeometry(0.38, 1.3, 0.5), o.govde, -0.96, 2.0, 0.08).rotation.z = -0.16; ekle(new THREE.BoxGeometry(0.38, 1.3, 0.5), o.govde, 0.96, 2.0, 0.08).rotation.z = 0.16;
    ekle(new THREE.CylinderGeometry(0.52, 0.52, 0.85, 24), "#e8b88a", 0, 3.25, 0);
    if (o.topuz) { ekle(new THREE.SphereGeometry(0.58, 24, 12, 0, 7, 0, 1.7), "#2b1b17", 0, 3.5, -0.05); ekle(new THREE.SphereGeometry(0.3, 16, 12), "#2b1b17", 0, 3.75, -0.55); const gz = new THREE.CylinderGeometry(0.15, 0.15, 0.06, 16); [-0.2, 0.2].forEach((dx) => (ekle(gz, "#f2a516", dx, 3.3, 0.52, { emissive: "#f2a516", emissiveIntensity: 0.9 }).rotation.x = Math.PI / 2)); }
    if (o.kask) { ekle(new THREE.SphereGeometry(0.66, 24, 14, 0, 7, 0, 1.75), "#3a5480", 0, 3.4, 0); ekle(new THREE.BoxGeometry(0.9, 0.3, 0.1), "#05070c", 0, 3.35, 0.56); ekle(new THREE.BoxGeometry(1.5, 1.5, 1.0), "#f2a516", 0, 2.25, -0.95); }
    g.position.set(x, 0.4, z); g.rotation.y = o.yon || 0; scene.add(g);
  }
  figur(9.6, 10.2, { bacak: "#1d3052", govde: "#b0652a", etek: true, topuz: true, yon: 0.75 });
  figur(2.6, 11.2, { bacak: "#6b7a99", govde: "#3a5480", kask: true, yon: 0.2 });

  // ipucu: kapının önünde duran saat
  const ip = silindir(6.4, 0.4, 9.8, 0.55, 0.22, "#f2a516", { emissive: "#f2a516", emissiveIntensity: 1.2 });

  // bütün çıkıntılar tek örnekli ağ
  const sm = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.3, 0.3, 0.2, 16), new THREE.MeshStandardMaterial({ roughness: 0.32 }), studs.length), d = new THREE.Object3D(), renk = new THREE.Color();
  studs.forEach(([x, y, z, c], i) => { d.position.set(x, y, z); d.updateMatrix(); sm.setMatrixAt(i, d.matrix); sm.setColorAt(i, renk.set(c)); });
  sm.castShadow = sm.receiveShadow = true; scene.add(sm);

  renderer.render(scene, cam);
  window.__hazir = true;
</script>
</body>
</html>
