<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>Kör Nokta — sinematik 3D denemesi</title>
<link rel="stylesheet" href="../assets/kn.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #05070c; }
  canvas { position: absolute; left: 0; top: 0; }
  #ust, #alt { position: absolute; left: 0; width: 1080px; height: 520px; pointer-events: none; }
  #ust { top: 0; background: linear-gradient(#05070c 0%, #05070c 22%, rgba(5, 7, 12, 0) 100%); }
  #alt { bottom: 0; background: linear-gradient(rgba(5, 7, 12, 0) 0%, #05070c 62%, #05070c 100%); }
  .y { position: absolute; color: #efe6d2; }
  #etiket { left: 60px; top: 196px; font-family: var(--kn-dosya); font-weight: 700; font-size: 30px; letter-spacing: 0.06em; }
  #baslik { left: 0; width: 1080px; top: 262px; text-align: center; font-family: var(--kn-baslik); font-size: 170px; line-height: 1.15; letter-spacing: 0.02em; white-space: nowrap; }
  #baslik i { display: inline-block; width: 104px; height: 104px; border-radius: 50%; background: #f2a516; margin: 0 8px 0 6px; vertical-align: -2px; box-shadow: 0 0 60px rgba(242, 165, 22, 0.7); }
  #bolum { left: 0; width: 1080px; top: 478px; text-align: center; font-family: var(--kn-dosya); font-weight: 700; font-size: 38px; color: #f2a516; letter-spacing: 0.08em; }
  #altyazi { left: 0; width: 1080px; top: 1440px; text-align: center; font-family: var(--kn-dosya); font-weight: 700; font-size: 50px; line-height: 1.3; text-shadow: 0 3px 0 #05070c, 0 0 18px #05070c; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="ust"></div><div id="alt"></div>
<div class="y" id="etiket">@BFStudiosAI</div>
<div class="y" id="baslik">KÖR N<i></i>KTA</div>
<div class="y" id="bolum">BÖLÜM 1 · DURAN SAAT</div>
<div class="y" id="altyazi">“Saat durmuş.<br>Katil durmamış.”</div>
<script type="module">
  import * as THREE from "../assets/vendor/three.module.js";
  window.__hazir = false;
  function tohum(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const r = tohum(250);

  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(1080, 1920, false);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.35;
  const scene = new THREE.Scene(); const SIS = "#0b1424";
  scene.background = new THREE.Color(SIS); scene.fog = new THREE.FogExp2(SIS, 0.034);
  const cam = new THREE.PerspectiveCamera(40, 1080 / 1920, 0.1, 200);
  cam.position.set(0.15, 1.45, 6.6); cam.lookAt(0.45, 2.75, -12);

  scene.add(new THREE.HemisphereLight("#4a64a0", "#05070c", 0.55));
  const ay = new THREE.DirectionalLight("#8fa8e0", 0.9); ay.position.set(-10, 20, -20); scene.add(ay);

  const std = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, ...o });
  const zemin = new THREE.Mesh(new THREE.PlaneGeometry(80, 160), std("#0a101c", { roughness: 0.22, metalness: 0.55 }));
  zemin.rotation.x = -Math.PI / 2; zemin.position.z = -50; zemin.receiveShadow = true; scene.add(zemin);
  // kaldırımlar
  [-1, 1].forEach((s) => { const k = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.16, 140), std("#141d30")); k.position.set(s * 2.25, 0.08, -55); k.receiveShadow = true; scene.add(k); });

  // evler ve pencereler
  const penGeo = new THREE.PlaneGeometry(0.55, 0.85), yanik = new THREE.MeshBasicMaterial({ color: "#f2a516" }), sonuk = new THREE.MeshBasicMaterial({ color: "#1d3052" });
  [-1, 1].forEach((s) => {
    let z = 9;
    while (z > -90) {
      const d = 4 + r() * 3, h = 6.5 + r() * 6, w = 5;
      const ev = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), std(["#101a2e", "#162441", "#0d1526", "#1a2a48"][(r() * 4) | 0]));
      ev.position.set(s * (2.7 + w / 2), h / 2, z - d / 2); ev.castShadow = ev.receiveShadow = true; scene.add(ev);
      for (let kat = 0; kat < Math.floor(h / 2.1); kat++) for (let k = 0; k < Math.floor(d / 1.5); k++) {
        if (kat === 0 && s === 1 && z < -2 && z > -11) continue;
        const p = new THREE.Mesh(penGeo, r() > 0.84 ? yanik : sonuk);
        p.position.set(s * 2.69, 1.9 + kat * 2.1, z - 0.8 - k * 1.5); p.rotation.y = -s * Math.PI / 2; scene.add(p);
      }
      z -= d + 0.15;
    }
  });
  // uzakta kule ve ay
  const kule = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.6, 26, 12), std("#14213a")); kule.position.set(-3, 13, -78); scene.add(kule);
  const kulah = new THREE.Mesh(new THREE.ConeGeometry(2.8, 7, 12), std("#14213a")); kulah.position.set(-3, 29.5, -78); scene.add(kulah);
  const ayTop = new THREE.Mesh(new THREE.SphereGeometry(3.4, 32, 16), new THREE.MeshBasicMaterial({ color: "#efe6d2", fog: false })); ayTop.position.set(-1.2, 21, -110); scene.add(ayTop);

  // antikacı: aralık kapı, dışarı taşan ışık
  const kapi = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 2.7), new THREE.MeshBasicMaterial({ color: "#ffc24a" })); kapi.position.set(2.68, 1.35, -6); kapi.rotation.y = -Math.PI / 2; scene.add(kapi);
  const vitrin = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.5), new THREE.MeshBasicMaterial({ color: "#f2a516" })); vitrin.position.set(2.68, 1.75, -8.6); vitrin.rotation.y = -Math.PI / 2; scene.add(vitrin);
  const spot = new THREE.SpotLight("#f2a516", 520, 30, 0.75, 0.6, 1.4); spot.position.set(2.55, 2.2, -6); spot.target.position.set(-2.4, 0, 1);
  spot.castShadow = true; spot.shadow.mapSize.set(1024, 1024); spot.shadow.bias = -0.002; scene.add(spot, spot.target);
  const dolgu = new THREE.PointLight("#f2a516", 60, 14, 1.6); dolgu.position.set(1.9, 1.5, -6.6); scene.add(dolgu);

  // sokak lambaları
  [[-2.2, -3], [2.2, -19], [-2.2, -34], [2.2, -50]].forEach(([x, z]) => {
    const direk = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 4.6, 8), std("#05070c")); direk.position.set(x, 2.3, z); scene.add(direk);
    const kol = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.07, 0.07), std("#05070c")); kol.position.set(x - Math.sign(x) * 0.35, 4.55, z); scene.add(kol);
    const amp = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), new THREE.MeshBasicMaterial({ color: "#ffd27a", fog: false })); amp.position.set(x - Math.sign(x) * 0.7, 4.45, z); scene.add(amp);
    const l = new THREE.PointLight("#f2a516", 46, 16, 1.7); l.position.copy(amp.position); l.position.y -= 0.2; scene.add(l);
  });

  // Mercan: sırtı kameraya dönük
  const koyu = std("#0b0f18", { roughness: 0.7 });
  const mercan = new THREE.Group();
  const palto = new THREE.Mesh(new THREE.LatheGeometry([[0.0, 0.42], [0.43, 0.42], [0.39, 0.8], [0.29, 1.15], [0.27, 1.3], [0.34, 1.45], [0.13, 1.53], [0.08, 1.6], [0, 1.6]].map(([a, b]) => new THREE.Vector2(a, b)), 28), koyu);
  palto.scale.z = 0.55; [-0.12, 0.12].forEach((dx) => { const b = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.06, 0.46, 10), koyu); b.position.set(dx, 0.23, 0); b.castShadow = true; mercan.add(b); }); [-1, 1].forEach((sx) => { const k = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.06, 0.72, 10), koyu); k.position.set(sx * 0.37, 1.08, 0); k.rotation.z = sx * 0.1; k.castShadow = true; mercan.add(k); }); palto.castShadow = true; mercan.add(palto);
  const bas = new THREE.Mesh(new THREE.SphereGeometry(0.135, 24, 16), koyu); bas.position.y = 1.74; bas.castShadow = true; mercan.add(bas);
  const topuz = new THREE.Mesh(new THREE.SphereGeometry(0.065, 16, 12), koyu); topuz.position.set(0, 1.8, 0.14); topuz.castShadow = true; mercan.add(topuz);
  
  mercan.position.set(-0.55, 0, -1.2); mercan.rotation.y = -0.3; scene.add(mercan);
  // Poyraz: kapının yanında, kasklı
  const poyraz = new THREE.Group();
  const pg = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.3, 1.5, 16), koyu); pg.position.y = 0.75; pg.castShadow = true; poyraz.add(pg);
  const pk = new THREE.Mesh(new THREE.SphereGeometry(0.22, 20, 14), std("#1d3052", { roughness: 0.3 })); pk.position.y = 1.66; pk.castShadow = true; poyraz.add(pk);
  const kutu = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.36), std("#f2a516", { emissive: "#f2a516", emissiveIntensity: 0.25 })); kutu.position.set(0, 1.12, 0.33); poyraz.add(kutu);
  poyraz.position.set(1.55, 0, -4.4); poyraz.rotation.y = 0.9; scene.add(poyraz);
  // ipucu: eşikte parlayan saat
  const saat = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.03, 24), new THREE.MeshBasicMaterial({ color: "#ffe2a0" })); saat.position.set(1.2, 0.02, -5.4); scene.add(saat);

  // yağmur
  const n = 1400, pos = new Float32Array(n * 6);
  for (let i = 0; i < n; i++) { const x = (r() - 0.5) * 9, y = r() * 12, z = 6 - r() * 46, l = 0.35 + r() * 0.35; pos.set([x, y, z, x - l * 0.22, y - l, z], i * 6); }
  const yg = new THREE.BufferGeometry(); yg.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.LineSegments(yg, new THREE.LineBasicMaterial({ color: "#9db3dc", transparent: true, opacity: 0.32 })));

  renderer.render(scene, cam);
  window.__hazir = true;
</script>
</body>
</html>
