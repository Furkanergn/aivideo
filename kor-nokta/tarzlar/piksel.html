<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>Kör Nokta — piksel sanat denemesi</title>
<link rel="stylesheet" href="../assets/kn.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #05070c; }
  canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; image-rendering: pixelated; }
  .px { position: absolute; font-family: "KN Piksel", monospace; font-weight: 700; color: #efe6d2; line-height: 1.15; }
  #etiket { left: 64px; top: 200px; font-size: 40px; }
  #saatyazi { left: 0; width: 1080px; top: 792px; text-align: center; font-size: 56px; color: #f2a516; letter-spacing: 0.08em; }
  #baslik { left: 0; width: 1080px; top: 858px; text-align: center; font-size: 150px; letter-spacing: 0.02em; text-shadow: 8px 8px 0 #05070c; }
  #diyalog { left: 64px; top: 1056px; width: 952px; background: #05070c; border: 8px solid #efe6d2; box-shadow: 0 0 0 8px #05070c; padding: 22px 30px 20px; font-size: 48px; }
  #diyalog b { color: #f2a516; font-weight: 700; }
</style>
</head>
<body>
<canvas id="c" width="135" height="240"></canvas>
<div class="px" id="etiket">@kullaniciadi</div>
<div class="px" id="saatyazi">02.50 · BÖLÜM 1</div>
<div class="px" id="baslik">KÖR NOKTA</div>
<div class="px" id="diyalog"><b>MERCAN:</b> Saat durmuş.<br>Katil durmamış.</div>
<script>
  function tohum(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const r = tohum(250);
  const P = { k: "#05070c", n: "#0f1a2e", b: "#1d3052", c: "#3a5480", w: "#efe6d2", a: "#f2a516", t: "#c9772b", d: "#8a4f1d", s: "#e8b88a", h: "#2b1b17", g: "#6b7a99", o: "#b8780c" };
  const cv = document.getElementById("c"), x = cv.getContext("2d");
  x.imageSmoothingEnabled = false;
  const px = (c, a, b, w = 1, h = 1) => { x.fillStyle = P[c] || c; x.fillRect(a | 0, b | 0, w, h); };
  const sprite = (rows, ox, oy) => rows.forEach((row, j) => [...row].forEach((ch, i) => { if (ch !== ".") px(ch, ox + i, oy + j); }));
  const ZEMIN = 188;

  // gökyüzü: düz bantlar, gradyan yok
  px("n", 0, 0, 135, 240); px("b", 0, 120, 135, 30); px("c", 0, 146, 135, 6);
  for (let i = 0; i < 46; i++) px(r() > 0.8 ? "a" : "w", r() * 135, 28 + r() * 86);
  // ay
  for (let j = -9; j <= 9; j++) for (let i = -9; i <= 9; i++) if (i * i + j * j <= 81 && (i + 4) * (i + 4) + (j + 3) * (j + 3) > 70) px("w", 112 + i, 40 + j);

  // saat (kahraman öğe)
  const cx = 67, cy = 70;
  for (let j = -30; j <= 30; j++) for (let i = -30; i <= 30; i++) {
    const m = i * i + j * j;
    if (m <= 27 * 27 + 20) px("k", cx + i, cy + j);
    if (m <= 26 * 26) px(i + j > 22 ? "o" : "a", cx + i, cy + j);
    if (m <= 21 * 21 + 8) px("k", cx + i, cy + j);
    if (m <= 20 * 20) px("w", cx + i, cy + j);
  }
  px("k", cx - 3, cy - 33, 6, 5); px("a", cx - 2, cy - 32, 4, 3);
  for (let k = 0; k < 6; k++) { px("w", cx - 1, cy - 37 - k * 4, 2, 3); px("k", cx - 1, cy - 38 - k * 4, 2, 1); }
  for (let i = 0; i < 12; i++) { const t = (i * Math.PI) / 6; px("k", cx + Math.round(Math.sin(t) * 17), cy - Math.round(Math.cos(t) * 17), i % 3 ? 1 : 2, i % 3 ? 1 : 2); }
  const ibre = (derece, boy, kalin) => { const t = (derece * Math.PI) / 180; for (let s = 0; s <= boy; s++) px("k", cx + Math.round(Math.sin(t) * s), cy - Math.round(Math.cos(t) * s), kalin, kalin); };
  ibre(85, 11, 2); ibre(300, 16, 1);
  [[-9, -12], [-6, -9], [-8, -6], [-4, -3], [-2, 1], [-5, 4], [-1, 8], [1, 12], [4, 15]].forEach(([i, j]) => px("c", cx + i, cy + j));

  // evler
  let bx = -4;
  while (bx < 135) {
    const w = 16 + ((r() * 12) | 0), h = 24 + ((r() * 22) | 0), ust = ZEMIN - h;
    px("k", bx, ust, w, h); px("b", bx + 1, ust + 1, w - 2, 1);
    for (let j = 0; j < 4; j++) for (let i = 0; i < 2; i++) { const wy = ust + 5 + j * 8; if (wy < ZEMIN - 9) px(r() > 0.8 ? "a" : "b", bx + 3 + i * (w - 9), wy, 3, 4); }
    bx += w + 1;
  }
  // antikacı: aralık kapı, yanan ışık
  px("k", 50, 150, 30, 38); px("c", 50, 150, 30, 1); px("w", 53, 153, 24, 7); px("k", 54, 154, 22, 5);
  px("a", 60, 166, 10, 22); px("o", 60, 166, 3, 22); px("k", 67, 166, 3, 22);
  // sokak lambası ve noktalı ışık konisi
  for (let j = 0; j < 44; j++) for (let i = -j / 3; i <= j / 3; i++) if (((i | 0) + j) % 2 === 0) px("o", 19 + (i | 0), 146 + j);
  px("k", 12, 140, 2, 48); px("k", 12, 139, 8, 2); px("k", 16, 141, 7, 3); px("a", 17, 144, 5, 2);
  // zemin ve ıslak yansımalar
  px("k", 0, ZEMIN, 135, 52); px("c", 0, ZEMIN, 135, 1);
  for (let i = 0; i < 26; i++) px(r() > 0.5 ? "b" : "o", r() * 135, ZEMIN + 4 + ((r() * 40) | 0), 3 + ((r() * 8) | 0), 1);
  for (let j = 0; j < 12; j++) px("o", 61 + (j % 2), ZEMIN + 3 + j * 2, 8, 1);

  const mercan = [
    ".....hhhhh......", "....hhhhhhhh....", "...hhhhhhhhhh.hh", "...hhssssssshhhh", "...hsssssssshhhh", "...hawwsawwsh.hh",
    "...hsssssssh....", "....sssssss.....", ".....ssdss......", "....tttsttt.....", "...ttttwtttt....", "..tttttttttttt..",
    "..ttdtttttdttt..", "..ttdtttttdttt..", "..ttdttkttdttt..", "..ttdtttttdttt..", "..ssdttkttdtss..", "...ddtttttdd....",
    "...dttttttdd....", "...dttkttttd....", "...dtttttttd....", "...dtttttttd....", "...ddddddddd....", "....kk...kk.....",
    "....gg...gg.....", "....gg...gg.....", "...ggg...ggg....",
  ];
  const poyraz = [
    "....cccccc....", "...cccccccc...", "...ccwwwwcc...", "...ccwwwwcc...", "...ccsssscc...", "....ssssss....", ".aaaa.ss......",
    ".aaaabbbbbb...", ".aoaabbbbbbb..", ".aaaabbbbbbb..", ".aoaabbbbbbbs.", ".aaaabbbbbb.s.", ".....bbbbbb...", ".....bbbbbb...",
    ".....gggggg...", ".....gg..gg...", ".....gg..gg...", ".....gg..gg...", ".....gg..gg...", "....www..www..",
  ];
  sprite(mercan, 84, ZEMIN - mercan.length);
  sprite(poyraz, 30, ZEMIN - poyraz.length);
  // yağmur
  for (let i = 0; i < 60; i++) { const a = (r() * 135) | 0, b = 26 + ((r() * 180) | 0); px("c", a, b); px("c", a - 1, b + 1); px("c", a - 1, b + 2); }
</script>
</body>
</html>
