            const d = 4 + r() * 3, h = 6.5 + r() * 6, w = 5;
            const ev = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), std(["#101a2e", "#162441", "#0d1526", "#1a2a48"][(r() * 4) | 0]));
            ev.position.set(s * (2.7 + w / 2), h / 2, z - d / 2); ev.castShadow = ev.receiveShadow = true; scene.add(ev);
            for (let kat = 0; kat < Math.floor(h / 2.1); kat++) for (let k = 0; k < Math.floor(d / 1.5); k++) {
              if (kat === 0 && s === 1 && z < -2 && z > -11) continue;
              const p = new THREE.Mesh(penGeo, r() > 0.84 ? yanik : sonuk);
              p.position.set(s * 2.69, 1.9 + kat * 2.1, z - 0.8 - k * 1.5); p.rotation.y = (-s * Math.PI) / 2; scene.add(p);

        const kule = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.6, 26, 12), std("#14213a")); kule.position.set(-3, 13, -78); scene.add(kule);

        // antikacı: aralık kapı, dışarı taşan ışık
        const kapi = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 2.7), new THREE.MeshBasicMaterial({ color: "#ffc24a" })); kapi.position.set(2.68, 1.35, -6); kapi.rotation.y = -Math.PI / 2; scene.add(kapi);

        const spot = new THREE.SpotLight("#f2a516", 520, 30, 0.75, 0.6, 1.4); spot.position.set(2.55, 2.2, -6); spot.target.position.set(-2.4, 0, 1);
        spot.castShadow = true; spot.shadow.mapSize.set(1024, 1024); spot.shadow.bias = -0.002; scene.add(spot, spot.target);
        const dolgu = new THREE.PointLight("#f2a516", 60, 14, 1.6); dolgu.position.set(1.9, 1.5, -6.6); scene.add(dolgu);
        [[-2.2, -3], [2.2, -19], [-2.2, -34], [2.2, -50]].forEach(([x, z]) => {
          const direk = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 4.6, 8), std("#05070c")); direk.position.set(x, 2.3, z); scene.add(direk);

          const l = new THREE.PointLight("#f2a516", 46, 16, 1.7); l.position.copy(amp.position); l.position.y -= 0.2; scene.add(l);
        });
        // Mercan: sırtı kameraya dönük, kapıya yürür

        const mercan = new THREE.Group();
        const palto = new THREE.Mesh(new THREE.LatheGeometry([[0.0, 0.42], [0.43, 0.42], [0.39, 0.8], [0.29, 1.15], [0.27, 1.3], [0.34, 1.45], [0.13, 1.53], [0.08, 1.6], [0, 1.6]].map(([a, b]) => new THREE.Vector2(a, b)), 28), koyu);

        const bacak = [-0.12, 0.12].map((dx) => { const b = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.06, 0.46, 10), koyu); b.position.set(dx, 0.23, 0); b.castShadow = true; mercan.add(b); return b; });
        [-1, 1].forEach((sx) => { const k = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.06, 0.72, 10), koyu); k.position.set(sx * 0.37, 1.08, 0); k.rotation.z = sx * 0.1; k.castShadow = true; mercan.add(k); });
        const bas = new THREE.Mesh(new THREE.SphereGeometry(0.135, 24, 16), koyu); bas.position.y = 1.74; bas.castShadow = true; mercan.add(bas);
        const topuz = new THREE.Mesh(new THREE.SphereGeometry(0.065, 16, 12), koyu); topuz.position.set(0, 1.8, 0.14); topuz.castShadow = true; mercan.add(topuz);
        scene.add(mercan);
        // Poyraz: kapının yanında, kasklı
        const poyraz = new THREE.Group();
        const pg = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.27, 1.45, 16), koyu); pg.position.y = 0.73; pg.castShadow = true; poyraz.add(pg);

        // yağmur: her damla zamana bağlı, döngüsel
        const n = 1400, damla = [], pos = new Float32Array(n * 6);

        const yg = new THREE.BufferGeometry(); yg.setAttribute("position", new THREE.BufferAttribute(pos, 3));

        const yumusak = (a) => a * a * (3 - 2 * a);

        function ciz(t) {
          const p = yumusak(Math.min(1, Math.max(0, t / SURE)));
          cam.position.set(0.15 - 0.25 * p, 1.45 + 0.1 * p, 6.6 - 3.4 * p);

          bacak[0].position.z = Math.sin(t * 5.2) * 0.11; bacak[1].position.z = -Math.sin(t * 5.2) * 0.11;
          for (let i = 0; i < n; i++) { const d = damla[i]; let y = (d[1] - d[4] * t) % 12; if (y < 0) y += 12; pos.set([d[0], y, d[2], d[0] - d[3] * 0.22, y - d[3], d[2]], i * 6); }
          yg.attributes.position.needsUpdate = true;
          renderer.render(scene, cam);
        }

        const tl = gsap.timeline({ paused: true }), saat = { t: 0 };

        ciz(0);

      });
