    <script>
      (function () {
        const E = window.REEL.egri, tl = gsap.timeline({ paused: true });
        // replik başlangıcı ve konuşma süresi (ses-miks-v2.py ile aynı)
        const R = { r01: [0.65, 5.35], r02: [7.44, 6.48], r03: [16.67, 4.67], r04: [22.16, 4.02], r05: [27.98, 3.14], r06: [32.35, 3.91], r07: [38.17, 6.05],
          r08: [45.54, 4.68], r09: [51.09, 2.04], r10: [53.64, 2.74], r11: [58.13, 3.42], r12: [62.93, 2.83], r13: [68.28, 3.67] };
        const S = { s1: 0, s2: 6.8, s3: 11.2, s4: 14.9, s5: 21.6, s6: 26.9, s7: 31.6, s8: 37.3, s9: 44.8, s10: 57, s11: 62.6, s12: 67.6 };
        // sahne geçişi: yeni sayfa eskisinin üstüne kayar
        Object.keys(S).slice(1).forEach((id) => tl.fromTo(document.getElementById(id).firstElementChild, { xPercent: 100 }, { xPercent: 0, duration: 0.32, ease: E.giris }, S[id]));
        // yavaş kamera hareketi
        const kam = (sec, t0, t1, a, b, org) => tl.fromTo(sec, { scale: a[0], x: a[1], y: a[2], transformOrigin: org }, { scale: b[0], x: b[1], y: b[2], duration: t1 - t0, ease: "sine.inOut", transformOrigin: org }, t0);
        // bir repliği parçalara bölüp sırayla gösterir; parça süreleri harf sayısıyla orantılı
        function metin(sahne, tur, konum, r, parcalar, sec = {}) {
          const [t0, sure] = R[r], top = parcalar.reduce((n, p) => n + p.replace(/<br>/g, " ").length, 0), ebeveyn = document.getElementById(sahne).firstElementChild;
          let birikim = sec.bas || 0; const toplam = sec.toplam || top;
          parcalar.forEach((p, i) => {
            const el = document.createElement("div");
            el.className = tur === "balon" ? "kn-balon" + (sec.fisilti ? " fisilti" : "") : "anlati";
            el.innerHTML = p + (tur === "balon" && sec.kuyruk ? `<i class="${sec.kuyruk}" style="left: ${sec.kuyrukX || 120}px"></i>` : "");
            Object.assign(el.style, { left: konum[0] + "px", top: konum[1] + "px" });
            if (tur === "balon") el.style.transformOrigin = sec.kuyruk === "ust" ? "20% 0%" : "20% 100%";
            ebeveyn.appendChild(el);
            const t = t0 + (sure * birikim) / toplam; birikim += p.replace(/<br>/g, " ").length;
            const son = i === parcalar.length - 1 ? (sec.bitis || t0 + sure + 0.7) : t0 + (sure * birikim) / toplam;
            if (tur === "balon") tl.fromTo(el, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: E.yay }, t - 0.08);
            else tl.fromTo(el, { clipPath: "inset(0% 100% 0% 0%)", opacity: 1 }, { clipPath: "inset(0% -3% 0% 0%)", duration: 0.32, ease: "power1.out" }, t - 0.05);
            tl.to(el, { opacity: 0, duration: 0.12, ease: "none" }, son - 0.12);
          });
        }

        // S1 — duran saat (0. kare kapak)
        gsap.set("#s1-akrep", { rotation: 85, svgOrigin: "534 939" }); gsap.set("#s1-yelkovan", { rotation: 300, svgOrigin: "534 939" });
        tl.fromTo("#s1-saniye", { rotation: 150, svgOrigin: "534 939" }, { rotation: 156, duration: 0.07, ease: "power4.out", svgOrigin: "534 939" }, 0.31);
        [1.31, 2.31, 3.31, 4.31].forEach((t, i) => tl.to("#s1-saniye", { rotation: 162 + i * 6, duration: 0.07, ease: "power4.out", svgOrigin: "534 939" }, t));
        tl.fromTo("#s1-resim", { rotation: 2.2, scale: 1.04, transformOrigin: "50% 0%" }, { rotation: -1.8, duration: 1.5, ease: E.sakin, transformOrigin: "50% 0%" }, 0)
          .to("#s1-resim", { rotation: 1.3, duration: 1.5, ease: E.sakin }, 1.5).to("#s1-resim", { rotation: -0.7, duration: 1.4, ease: E.sakin }, 3.0)
          .to("#s1-resim", { rotation: 0, scale: 1.12, duration: 2.6, ease: "sine.out" }, 4.4);
        [["#s1-tik1", 0.31, 8], ["#s1-tik2", 2.31, -7]].forEach(([s, t, r]) => tl.fromTo(s, { scale: 0, opacity: 0, rotation: r }, { scale: 1, opacity: 1, duration: 0.16, ease: E.yay }, t).to(s, { opacity: 0, y: -30, duration: 0.3, ease: E.cikis }, t + 0.7));
        tl.fromTo("#s1-resim img", { x: 0 }, { x: 9, duration: 0.04, repeat: 5, yoyo: true, ease: "none" }, 5.98)
          .to("#s1-baslik", { opacity: 0, duration: 0.3 }, 0.35).to("#s1-kutu", { opacity: 0, duration: 0.3 }, 6.2);
        metin("s1", "anlati", [64, 1380], "r01", ["Balat'ta saatler<br>acele etmez.", "Ama o gece biri,<br>üçe on kala durdu."], { bitis: 6.75 });

        // S2 — sokak, yağmur
        kam("#s2-resim", 6.8, 11.6, [1.16, -70, 60], [1.04, 20, -10], "70% 60%");
        tl.fromTo("#s2-yagmur", { y: 0, x: 0 }, { y: 480, x: -110, duration: 0.8, ease: "none", repeat: 5 }, 6.8);
        metin("s2", "anlati", [64, 1380], "r02", ["Antikacı Nazım Bey'i<br>dükkânında,", "kendi koltuğunda<br>buldular."], { toplam: 94, bitis: 11.3 });
        // S3 — koltuk, kasa
        kam("#s3-resim", 11.2, 15.3, [1.03, 0, 0], [1.2, 0, 0], "55% 40%");
        metin("s3", "anlati", [64, 1380], "r02", ["Kapı aralıktı,", "kasaya<br>dokunulmamıştı."], { toplam: 94, bas: 58, bitis: 14.7 });
        // S4 — Poyraz kapıda (önce girer, sonra konuşur)
        kam("#s4-resim", 14.9, 22, [1.2, 0, 40], [1.05, 0, 0], "55% 25%");
        tl.fromTo("#s4-ad", { x: -420 }, { x: 0, duration: 0.35, ease: E.giris }, 15.7);
        metin("s4", "balon", [64, 1250], "r03", ["Paketi bırakmaya<br>gelmiştim abla.", "Seslendim,<br>cevap gelmedi.", "Hiçbir şeye<br>dokunmadım."], { kuyruk: "ust", kuyrukX: 320 });
        // S5 — kasa yerinde
        kam("#s5-resim", 21.6, 27.3, [1.04, 0, 0], [1.2, -60, 0], "80% 35%");
        metin("s5", "balon", [64, 1250], "r04", ["Ama kasa yerinde,<br>vitrin yerinde.", "Hırsız bunları<br>bırakır mı?"], { kuyruk: "ust", kuyrukX: 420 });
        // S6 — Mercan (es: önce yaklaşma, sonra cevap)
        kam("#s6-resim", 26.9, 32, [1.04, 0, 0], [1.22, 0, 0], "38% 27%");
        tl.fromTo("#s6-ad", { x: -420 }, { x: 0, duration: 0.35, ease: E.giris }, 27.3);
        metin("s6", "balon", [64, 1250], "r05", ["Hırsız girmedi,<br>Poyraz.", "Bu dükkâna bir<br>misafir geldi."], { kuyruk: "ust", kuyrukX: 260 });
        // S7 — çay bardakları
        kam("#s7-resim", 31.6, 37.7, [1.03, 0, 0], [1.2, -40, -30], "65% 55%");
        metin("s7", "balon", [64, 270], "r06", ["Masada iki çay<br>bardağı var.", "Biri soğumuş.", "Öbürü hâlâ ılık."], { kuyruk: "alt", kuyrukX: 120 });
        // S8 — anlatıcı: Mercan kim
        tl.fromTo("#s8-resim", { x: -330 }, { x: -820, duration: 7.9, ease: "sine.inOut" }, 37.3);
        metin("s8", "anlati", [64, 290], "r07", ["Mercan Arın yirmi yıl<br>adli tıpta çalıştı."], { toplam: 82, bitis: 44.9 });
        metin("s8", "anlati", [64, 1300], "r07", ["Bilir ki her oda,", "son misafirini<br>ele verir."], { toplam: 82, bas: 40, bitis: 44.9 });
        // S9 — saatin kapağı, 1/6
        kam("#s9-resim", 44.8, 57.4, [1.03, 0, 0], [1.24, 30, 120], "45% 20%");
        metin("s9", "balon", [64, 1280], "r08", ["Saat kendiliğinden<br>durmamış.", "Biri durdurmuş,", "sonra kapağına<br>bir şey kazımış."], { bitis: 50.7 });
        tl.fromTo("#s9-ek1", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: E.yay }, 50.85).to("#s9-ek1", { opacity: 0, duration: 0.15 }, 53.35)
          .fromTo("#s9-ek2", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: E.yay }, 53.45);
        metin("s9", "balon", [450, 1260], "r09", ["Altıda bir...<br>Bu ne demek?"], { bitis: 53.4 });
        metin("s9", "balon", [56, 1260], "r10", ["Bunun ilk olduğu<br>demek.", "Beş tane<br>daha var."], { bitis: 57.3 });
        // S10 — fısıltı (müzik susar)
        kam("#s10-resim", 57, 63, [1.02, 0, 0], [1.14, 0, 30], "50% 28%");
        metin("s10", "balon", [64, 1320], "r11", ["Abla...<br>çay ılıksa,", "o hâlâ burada<br>olabilir mi?"], { fisilti: true });
        // S11 — tavan, adım
        kam("#s11-resim", 62.6, 68, [1.18, 0, 80], [1.04, 0, 0], "60% 20%");
        metin("s11", "anlati", [64, 300], "r12", ["Tam o sırada,", "üst katta biri<br>bir adım attı."], { bitis: 66.0 });
