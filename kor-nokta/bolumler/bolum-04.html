    <script>
      (function () {
        const E = window.REEL.egri, tl = gsap.timeline({ paused: true });
        // replik başlangıcı ve konuşma süresi (ses-miks-v2.py ile aynı)
        const R = { r01: [0.78, 4.68], r02: [7.8, 3.04], r03: [12.15, 3.53], r04: [17.03, 3.66], r05: [21.92, 3.04], r06: [26.03, 2.23], r07: [30.99, 3.93],
          r08: [36.69, 2.96], r09: [41.0, 1.03], r10: [42.99, 3.39], r11: [47.54, 1.21], r12: [50.0, 1.44], r13: [53.25, 4.65] };
        const S = { u1: 0, u2: 6.8, u3: 11.4, u4: 16.2, u5: 21.2, u6: 25.4, u7: 28.4, u8: 35, u9: 40.4, u10: 42.2, u11: 47, u12: 49, u13: 52.4 };
        // sahne geçişi: yeni sayfa eskisinin üstüne kayar
        Object.keys(S).slice(1).forEach((id) => tl.fromTo(document.getElementById(id).firstElementChild, { xPercent: 100 }, { xPercent: 0, duration: 0.32, ease: E.giris }, S[id]));
        // yavaş kamera hareketi
        const kam = (sec, t0, t1, a, b, org) => tl.fromTo(sec, { scale: a[0], x: a[1], y: a[2], transformOrigin: org }, { scale: b[0], x: b[1], y: b[2], duration: t1 - t0, ease: "sine.inOut", transformOrigin: org }, t0);
        // bir repliği parçalara bölüp sırayla gösterir; parça süreleri harf sayısıyla orantılı
        function metin(sahne, tur, konum, r, parcalar, sec = {}) {
          const [t0, sure] = R[r], top = parcalar.reduce((n, p) => n + p.replace(/<br>/g, " ").length, 0), ebeveyn = document.getElementById(sahne).firstElementChild;
          let birikim = sec.bas || 0; const toplam = sec.toplam || top;
          parcalar.forEach((p, i) => {
            const el = document.createElement("div");
            el.className = tur === "balon" ? "kn-balon" + (sec.fisilti ? " fisilti" : "") : "anlati";
            el.innerHTML = p + (tur === "balon" && sec.kuyruk ? `<i class="${sec.kuyruk}" style="left: ${sec.kuyrukX || 120}px"></i>` : "");
            Object.assign(el.style, { left: konum[0] + "px", top: konum[1] + "px" });
            if (tur === "balon") el.style.transformOrigin = sec.kuyruk === "ust" ? "20% 0%" : "20% 100%";
            ebeveyn.appendChild(el);
            const t = t0 + (sure * birikim) / toplam; birikim += p.replace(/<br>/g, " ").length;
            const son = i === parcalar.length - 1 ? (sec.bitis || t0 + sure + 0.7) : t0 + (sure * birikim) / toplam;
            if (tur === "balon") tl.fromTo(el, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: E.yay }, t - 0.08);
            else tl.fromTo(el, { clipPath: "inset(0% 100% 0% 0%)", opacity: 1 }, { clipPath: "inset(0% -3% 0% 0%)", duration: 0.32, ease: "power1.out" }, t - 0.05);
            tl.to(el, { opacity: 0, duration: 0.12, ease: "none" }, son - 0.12);
          });
        }

        // U1 — Kuzguncuk'taki ev (0. kare kapak)
        kam("#u1-resim", 0, 7.1, [1.04, 0, 0], [1.26, 0, 0], "55% 38%");
        tl.to("#u1-baslik", { opacity: 0, duration: 0.3 }, 0.5).to("#u1-kutu", { opacity: 0, duration: 0.3 }, 6.2);
        metin("u1", "anlati", [64, 1360], "r01", ["Kuzguncuk'ta, yokuşun<br>başındaki ahşap evde", "yalnızca bir lamba<br>yanıyordu."], { bitis: 6.3 });
        // U2 — Mercan kapıda seslenir (es: kapı aralanır)
        kam("#u2-resim", 6.8, 11.7, [1.16, 0, 0], [1.04, 0, 0], "42% 24%");
        tl.fromTo("#u2-ad", { x: -520 }, { x: 0, duration: 0.35, ease: E.giris }, 7.2);
        metin("u2", "balon", [64, 1290], "r02", ["Feride Hanım?", "Polis değiliz.<br>Yardıma geldik."], { kuyruk: "ust", kuyrukX: 110 });
        // U3 — cevap yok; masada iki dolu bardak
        kam("#u3-resim", 11.4, 16.5, [1.04, 0, 0], [1.3, 0, 0], "52% 50%");
        metin("u3", "anlati", [64, 290], "r03", ["Cevap veren olmadı.", "Masada iki çay<br>bardağı vardı."], { bitis: 16.0 });
        // U4 — Poyraz
        kam("#u4-resim", 16.2, 21.5, [1.03, 0, 0], [1.14, 0, 0], "55% 26%");
        metin("u4", "balon", [64, 1300], "r04", ["Yine iki bardak...", "Abla, bu sefer<br>ikisi de dolu."], { kuyruk: "ust", kuyrukX: 110 });
        // U5 — Mercan (aynı panelde yüze yaklaşma)
        kam("#u5-resim", 21.2, 25.7, [1.5, 0, 0], [1.66, 0, 0], "40% 20%");
        metin("u5", "balon", [64, 1300], "r05", ["Çünkü daha<br>içmediler.", "Misafir yeni gelmiş."], { kuyruk: "ust", kuyrukX: 110 });
        // U6 — Poyraz anlar (es: müzik susar)
        kam("#u6-resim", 25.4, 28.7, [1.5, 0, 0], [1.62, 0, 0], "55% 22%");
        metin("u6", "balon", [64, 1300], "r06", ["Yeni mi?", "Yani hâlâ..."], { kuyruk: "ust", kuyrukX: 110, bitis: 28.35 });
        // U7 — arka odanın kapısı; sürüyen adım
        kam("#u7-resim", 28.4, 35.3, [1.03, 0, 0], [1.34, 0, 0], "54% 30%");
        tl.fromTo("#u7-ses", { scale: 0.4, opacity: 0, rotation: -5 }, { scale: 1, opacity: 1, duration: 0.2, ease: E.yay }, 29.2)
          .fromTo("#u7-ses", { x: 0 }, { x: 90, duration: 1.6, ease: "none" }, 29.3).to("#u7-ses", { opacity: 0, duration: 0.3 }, 30.75);
        metin("u7", "anlati", [64, 290], "r07", ["Arka odadan<br>bir ses geldi.", "Sürüyerek atılan<br>bir adımın sesi."], { bitis: 35.1 });
        // U8 — siluet (es: önce belirir, sonra konuşur)
        kam("#u8-resim", 35, 40.7, [1.3, 0, 60], [1.08, 0, 0], "50% 30%");
        tl.fromTo("#u8-resim img", { x: 0 }, { x: 8, duration: 0.05, repeat: 9, yoyo: true, ease: "none" }, 35.1)
          .fromTo("#u8-ad", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: E.yay }, 36.4);
        metin("u8", "balon", [64, 1300], "r08", ["Erken geldiniz,<br>Mercan Hanım.", "Saat daha dolmadı."], { kuyruk: "ust", kuyrukX: 110 });
        // U9 — Mercan
        kam("#u9-resim", 40.4, 42.5, [1.03, 0, 0], [1.1, 0, 0], "60% 30%");
        metin("u9", "balon", [64, 1330], "r09", ["Feride Hanım<br>nerede?"], { kuyruk: "ust", kuyrukX: 110, bitis: 42.2 });
        // U10 — gölgedeki yüz
        kam("#u10-resim", 42.2, 47.3, [1.03, 0, 0], [1.18, 0, 0], "48% 32%");
        metin("u10", "balon", [64, 1300], "r10", ["Güvende.<br>Şimdilik.", "Ama asıl soru<br>o değil."], { kuyruk: "ust", kuyrukX: 110, bitis: 46.9 });
        // U11 — Mercan
        kam("#u11-resim", 47, 49.3, [1.25, 0, 0], [1.36, 0, 0], "60% 28%");
        metin("u11", "balon", [64, 1330], "r11", ["Asıl soru ne?"], { kuyruk: "ust", kuyrukX: 110, bitis: 49.0 });
        // U12 — gülümseme
        kam("#u12-resim", 49, 52.7, [1.4, 0, 0], [1.6, 0, 0], "48% 34%");
        metin("u12", "balon", [64, 1300], "r12", ["Adınızı nereden<br>bildiğim."], { kuyruk: "ust", kuyrukX: 110, bitis: 52.35 });
        // U13 — kapanış
        kam("#u13-resim", 52.4, 60.5, [1.08, 0, 0], [1.2, 0, 0], "50% 30%");
        tl.fromTo("#son-logo", { y: -60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: E.giris }, 52.7)
          .fromTo("#son-soru", { scale: 1.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.28, ease: E.giris }, 53.25)
          .fromTo("#son-yorum", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% -3% 0% 0%)", duration: 0.45, ease: "power1.out" }, 55.3)
          .fromTo("#son-yarin", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: E.yay }, 57.2);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
