    <script>
      (function () {
        const E = window.REEL.egri, tl = gsap.timeline({ paused: true });
        // replik başlangıcı ve konuşma süresi (ses-miks-v2.py ile aynı)
        const R = { r01: [0.75, 4.69], r02: [8.67, 3.09], r03: [12.76, 4.46], r04: [19.37, 3.67], r05: [24.03, 4.56], r06: [29.55, 1.01], r07: [31.56, 3.47],
          r08: [36.95, 2.16], r09: [40.15, 4.7], r10: [48.24, 1.31], r11: [50.49, 0.86], r12: [52.67, 4.87], r13: [59.07, 4.57] };
        const S = { t1: 0, t2: 7.8, t3: 12, t4: 18.4, t5: 23.4, t6: 28.8, t7: 30.8, t8: 36, t9: 39.4, t10: 45.4, t11: 51.9, t12: 58.2 };
        // sahne geçişi: yeni sayfa eskisinin üstüne kayar
        Object.keys(S).slice(1).forEach((id) => tl.fromTo(document.getElementById(id).firstElementChild, { xPercent: 100 }, { xPercent: 0, duration: 0.32, ease: E.giris }, S[id]));
        // yavaş kamera hareketi
        const kam = (sec, t0, t1, a, b, org) => tl.fromTo(sec, { scale: a[0], x: a[1], y: a[2], transformOrigin: org }, { scale: b[0], x: b[1], y: b[2], duration: t1 - t0, ease: "sine.inOut", transformOrigin: org }, t0);
        // bir repliği parçalara bölüp sırayla gösterir; parça süreleri harf sayısıyla orantılı
        function metin(sahne, tur, konum, r, parcalar, sec = {}) {
          const [t0, sure] = R[r], top = parcalar.reduce((n, p) => n + p.replace(/<br>/g, " ").length, 0), ebeveyn = document.getElementById(sahne).firstElementChild;
          let birikim = sec.bas || 0; const toplam = sec.toplam || top;
          parcalar.forEach((p, i) => {
            const el = document.createElement("div");
            el.className = tur === "balon" ? "kn-balon" + (sec.fisilti ? " fisilti" : "") : "anlati";
            el.innerHTML = p + (tur === "balon" && sec.kuyruk ? `<i class="${sec.kuyruk}" style="left: ${sec.kuyrukX || 120}px"></i>` : "");
            Object.assign(el.style, { left: konum[0] + "px", top: konum[1] + "px" });
            if (tur === "balon") el.style.transformOrigin = sec.kuyruk === "ust" ? "20% 0%" : "20% 100%";
            ebeveyn.appendChild(el);
            const t = t0 + (sure * birikim) / toplam; birikim += p.replace(/<br>/g, " ").length;
            const son = i === parcalar.length - 1 ? (sec.bitis || t0 + sure + 0.7) : t0 + (sure * birikim) / toplam;
            if (tur === "balon") tl.fromTo(el, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: E.yay }, t - 0.08);
            else tl.fromTo(el, { clipPath: "inset(0% 100% 0% 0%)", opacity: 1 }, { clipPath: "inset(0% -3% 0% 0%)", duration: 0.32, ease: "power1.out" }, t - 0.05);
            tl.to(el, { opacity: 0, duration: 0.12, ease: "none" }, son - 0.12);
          });
        }

        // T1 — merdiven (0. kare kapak)
        kam("#t1-resim", 0, 8.1, [1.04, 0, 0], [1.2, 0, 60], "45% 25%");
        tl.to("#t1-baslik", { opacity: 0, duration: 0.3 }, 0.45).to("#t1-kutu", { opacity: 0, duration: 0.3 }, 7.2)
          .fromTo("#t1-gicirt", { scale: 0.4, opacity: 0, rotation: -6 }, { scale: 1, opacity: 1, duration: 0.2, ease: E.yay }, 6.3)
          .fromTo("#t1-gicirt", { x: 0 }, { x: 9, duration: 0.05, repeat: 19, yoyo: true, ease: "none" }, 6.4);
        metin("t1", "anlati", [64, 1380], "r01", ["Üst kattaki ayak sesi<br>bir kez duyuldu.", "Sonra ev,<br>nefesini tuttu."], { bitis: 6.15 });
        // T2 — Emre saklanıyor
        kam("#t2-resim", 7.8, 12.3, [1.22, 0, 0], [1.06, 0, 0], "60% 28%");
        tl.fromTo("#t2-ad", { x: -420 }, { x: 0, duration: 0.35, ease: E.giris }, 8.3)
          .fromTo("#t2-resim img", { x: 0 }, { x: 7, duration: 0.05, repeat: 13, yoyo: true, ease: "none" }, 8.7);
        metin("t2", "balon", [64, 1290], "r02", ["Yaklaşmayın!", "Ben yapmadım,", "yemin ederim<br>ben yapmadım!"], { kuyruk: "ust", kuyrukX: 330 });
        // T3 — Mercan sakinleştirir; es: tornavida düşer
        kam("#t3-resim", 12, 18.7, [1.04, 0, 0], [1.16, 0, 0], "52% 20%");
        metin("t3", "balon", [64, 1300], "r03", ["Biliyorum.", "Katil, elinde<br>tornavidayla", "tavan arasında<br>saklanmaz."], { kuyruk: "ust", kuyrukX: 300, bitis: 17.5 });
        tl.fromTo("#t3-tang", { scale: 0.3, opacity: 0, rotation: 9 }, { scale: 1, opacity: 1, duration: 0.16, ease: E.yay }, 17.82).to("#t3-tang", { opacity: 0, y: -30, duration: 0.3 }, 18.35);
        // T4 — Emre anlatır
        kam("#t4-resim", 18.4, 23.7, [1.03, 0, 0], [1.14, 0, 0], "50% 30%");
        metin("t4", "balon", [64, 1300], "r04", ["Ustam bu gece<br>birini bekliyordu.", "Beni erkenden<br>yukarı yolladı."], { kuyruk: "ust", kuyrukX: 300 });
        // T5 — döşeme aralığı
        kam("#t5-resim", 23.4, 29.1, [1.02, 0, 0], [1.24, 0, 0], "62% 45%");
        metin("t5", "balon", [64, 290], "r05", ["Aşağıda iki kişi<br>konuştu.", "Sonra dükkândaki<br>bütün saatler sustu."]);
        // T6 — Mercan sorar (aynı panelin yüzüne yaklaşma)
        kam("#t6-resim", 28.8, 31.1, [1.85, 0, 0], [2.0, 0, 0], "50% 14%");
        metin("t6", "balon", [64, 1300], "r06", ["Yüzünü gördün mü?"], { kuyruk: "ust", kuyrukX: 300, bitis: 30.75 });
        // T7 — ayakkabılar
        kam("#t7-resim", 30.8, 36.3, [1.25, 0, -120], [1.08, 0, 30], "70% 25%");
        metin("t7", "balon", [64, 290], "r07", ["Yalnız<br>ayakkabılarını.", "Sol ayağını sürüyerek<br>yürüyordu."], { bitis: 35.6 });
        // T8 — paket
        kam("#t8-resim", 36, 39.7, [1.03, 0, 0], [1.2, 0, 0], "52% 42%");
        metin("t8", "balon", [64, 1320], "r08", ["Poyraz.", "Elindeki paket<br>kime?"]);
        // T9 — Poyraz
        kam("#t9-resim", 39.4, 45.7, [1.03, 0, 0], [1.16, 0, 0], "50% 26%");
        metin("t9", "balon", [64, 1300], "r09", ["Nazım Bey'e.", "\"Bu gece teslim edilecek\"<br>diye not düşmüşler.", "Gönderen kısmı boş."], { kuyruk: "ust", kuyrukX: 330 });
        // T10 — paketten çıkan saat işliyor
        const M = "555 822";
        ["t10", "t12"].forEach((p) => { gsap.set("#" + p + "-akrep", { rotation: 140, svgOrigin: M }); gsap.set("#" + p + "-yelkovan", { rotation: 240, svgOrigin: M }); });
        kam("#t10-resim", 45.4, 52.2, [1.03, 0, 0], [1.3, -20, -40], "51% 43%");
        tl.fromTo("#t10-saniye", { rotation: 0, svgOrigin: M }, { rotation: 6, duration: 0.07, ease: "power4.out", svgOrigin: M }, 47.0);
        for (let k = 2; k <= 6; k++) tl.to("#t10-saniye", { rotation: 6 * k, duration: 0.07, ease: "power4.out", svgOrigin: M }, 46.0 + k);
        tl.fromTo("#t10-tik", { scale: 0, opacity: 0, rotation: 8 }, { scale: 1, opacity: 1, duration: 0.16, ease: E.yay }, 47.0).to("#t10-tik", { opacity: 0, y: -30, duration: 0.3 }, 47.75)
          .fromTo("#t10-ek", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: E.yay }, 50.25);
        metin("t10", "balon", [64, 1330], "r10", ["Bu saat çalışıyor."], { bitis: 50.1 });
        metin("t10", "balon", [450, 1270], "r11", ["İyi bir şey mi<br>bu?"], { bitis: 52.1 });
        // T11 — Mercan
        kam("#t11-resim", 51.9, 58.5, [1.03, 0, 0], [1.16, 0, 0], "70% 28%");
        metin("t11", "balon", [64, 1300], "r12", ["Hayır.", "İkincisi hâlâ<br>hayatta demek.", "Ve vakti<br>daralıyor."], { kuyruk: "ust", kuyrukX: 560 });
        // T12 — kapanış: saat işlemeye devam eder
