    <script>
      (function () {
        const E = window.REEL.egri, tl = gsap.timeline({ paused: true });
        // replik başlangıcı ve konuşma süresi (ses-miks-b10.py ile aynı)
        const R = { r01: [0.87, 4.59], r02: [6.68, 3.34], r03: [11.15, 3.58], r04: [15.73, 1.57], r05: [18.23, 3.89], r06: [23.48, 1.65], r07: [26.27, 4.1],
          r08: [32.28, 3.73], r09: [37.28, 4.83], r10: [43.28, 2.94], r11: [48.32, 4.57], r12: [54.22, 1.71], r13: [57.47, 6.2] };
        const S = { t1: 0, t2: 5.9, t3: 10.7, t4: 15.1, t5: 17.7, t6: 19.9, t7: 22.9, t8: 25.6, t9: 27.3, t10: 31.3, t11: 36.9, t12: 42.7, t13: 46.8, t14: 56.8 };
        // sahne geçişi: yeni sayfa eskisinin üstüne kayar
        Object.keys(S).slice(1).forEach((id) => tl.fromTo(document.getElementById(id).firstElementChild, { xPercent: 100 }, { xPercent: 0, duration: 0.32, ease: E.giris }, S[id]));
        // yavaş kamera hareketi
        const kam = (sec, t0, t1, a, b, org) => tl.fromTo(sec, { scale: a[0], x: a[1], y: a[2], transformOrigin: org }, { scale: b[0], x: b[1], y: b[2], duration: t1 - t0, ease: "sine.inOut", transformOrigin: org }, t0);
        // bir repliği parçalara bölüp sırayla gösterir; parça süreleri harf sayısıyla orantılı
        function metin(sahne, tur, konum, r, parcalar, sec = {}) {
          const [t0, sure] = R[r], top = parcalar.reduce((n, p) => n + p.replace(/<br>/g, " ").length, 0), ebeveyn = document.getElementById(sahne).firstElementChild;
          let birikim = sec.bas || 0; const toplam = sec.toplam || top;
          parcalar.forEach((p, i) => {
            const el = document.createElement("div");
            el.className = tur === "balon" ? "kn-balon" + (sec.fisilti ? " fisilti" : "") : "anlati";
            el.innerHTML = p + (tur === "balon" && sec.kuyruk ? `<i class="${sec.kuyruk}" style="left: ${sec.kuyrukX || 120}px"></i>` : "");
            Object.assign(el.style, { left: konum[0] + "px", top: konum[1] + "px" });
            if (tur === "balon") el.style.transformOrigin = sec.kuyruk === "ust" ? "20% 0%" : "20% 100%";
            ebeveyn.appendChild(el);
            const t = t0 + (sure * birikim) / toplam; birikim += p.replace(/<br>/g, " ").length;
            const son = i === parcalar.length - 1 ? (sec.bitis || t0 + sure + 0.7) : t0 + (sure * birikim) / toplam;
            if (tur === "balon") tl.fromTo(el, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: E.yay }, t - 0.08);
            else tl.fromTo(el, { clipPath: "inset(0% 100% 0% 0%)", opacity: 1 }, { clipPath: "inset(0% -3% 0% 0%)", duration: 0.32, ease: "power1.out" }, t - 0.05);
            tl.to(el, { opacity: 0, duration: 0.12, ease: "none" }, son - 0.12);
          });
        }

        // T1 — kapüşon düşer: Defne (0. kare kapak)
        kam("#t1-resim", 0, 6.2, [1.0, 0, 0], [1.08, 0, 0], "35% 28%");
        tl.to("#t1-baslik", { opacity: 0, duration: 0.3 }, 0.5).to("#t1-kutu", { opacity: 0, duration: 0.3 }, 5.5);
        metin("t1", "anlati", [64, 1560], "r01", ["Kapüşonun altından", "yirmi yaşlarında<br>bir kız çıktı.", "Poyraz onu tanıyordu."], { bitis: 5.8 });
        // T2 — Poyraz tanır, eli düşer
        kam("#t2-resim", 5.9, 11.0, [1.12, 0, 0], [1.02, 0, 0], "40% 25%");
        metin("t2", "balon", [64, 1300], "r02", ["Defne?", "Sen bizim şirkettesin.", "Gece<br>vardiyasındasın."], { kuyruk: "ust", kuyrukX: 110, bitis: 10.65 });
        // T3 — Defne gözlerini kaçırır
        kam("#t3-resim", 10.7, 15.4, [1.02, 0, 0], [1.12, 0, 0], "55% 30%");
        tl.fromTo("#t3-ad", { x: -420 }, { x: 0, duration: 0.35, ease: E.giris }, 11.0);
        metin("t3", "balon", [64, 1300], "r03", ["Ben bir şey yapmadım<br>Poyraz abi.", "Sipariş uygulamadan<br>düştü."], { kuyruk: "ust", kuyrukX: 110, bitis: 15.05 });
        // T4 — Tarık sorar
        kam("#t4-resim", 15.1, 18.0, [1.5, 0, 0], [1.62, 0, 0], "48% 20%");
        tl.fromTo("#t4-ad", { x: -520 }, { x: 0, duration: 0.35, ease: E.giris }, 15.35);
        metin("t4", "balon", [64, 1300], "r04", ["Kimden geldi<br>bu sipariş?"], { kuyruk: "ust", kuyrukX: 110, bitis: 17.65 });
        // T5 — Defne
        kam("#t5-resim", 17.7, 20.2, [1.3, 0, 0], [1.38, 0, 0], "55% 28%");
        metin("t5", "balon", [64, 1300], "r05", ["Gönderenin adı yok."], { kuyruk: "ust", kuyrukX: 110, toplam: 47, bitis: 19.88 });
        // T6 — telefondaki sipariş kartı: SAATÇİ
        kam("#t6-resim", 19.9, 23.2, [1.05, 0, 0], [1.3, 0, 0], "56% 22%");
        metin("t6", "balon", [64, 1300], "r05", ["Hesabın adı<br>yalnızca Saatçi."], { toplam: 47, bas: 19, bitis: 22.95 });
        // T7 — Mercan sorar
        kam("#t7-resim", 22.9, 25.9, [1.6, 0, 0], [1.72, 0, 0], "50% 20%");
        metin("t7", "balon", [64, 1300], "r06", ["Paketleri nereden<br>aldın, Defne?"], { kuyruk: "ust", kuyrukX: 110, bitis: 25.55 });
        // T8 — Defne
        kam("#t8-resim", 25.6, 27.6, [1.4, 0, 0], [1.46, 0, 0], "55% 28%");
        metin("t8", "balon", [64, 1300], "r07", ["Hep aynı yerden."], { kuyruk: "ust", kuyrukX: 110, toplam: 58, bitis: 27.28 });
        // T9 — eski arşiv binası, ardından sessizlik
        kam("#t9-resim", 27.3, 31.6, [1.25, 0, 0], [1.0, 0, 0], "68% 45%");
        metin("t9", "balon", [64, 1380], "r07", ["Adli Tıp Kurumu'nun", "eski arşiv<br>binasından."], { toplam: 58, bas: 16, bitis: 31.0 });
        // T10 — Mercan'ın yüzü değişir
        kam("#t10-resim", 31.3, 37.2, [1.0, 0, 0], [1.22, 0, 0], "52% 42%");
        metin("t10", "anlati", [64, 1500], "r08", ["Mercan'ın yüzü değişti.", "O binada yirmi yıl<br>çalışmıştı."], { bitis: 36.75 });
        // T11 — Tarık vakayı kapatır
        kam("#t11-resim", 36.9, 43.0, [1.35, 0, 0], [1.55, 0, 0], "48% 20%");
        metin("t11", "balon", [64, 1300], "r09", ["Hâkim Bey güvende.", "Çaycı da Defne de<br>ifadesini verdi.", "Bu vaka kapandı<br>Doktor Hanım."], { kuyruk: "ust", kuyrukX: 110, bitis: 42.6 });
