    <script>
      (function () {
        const E = window.REEL.egri, tl = gsap.timeline({ paused: true });
        // replik başlangıcı ve konuşma süresi (ses-miks-b06.py ile aynı)
        const R = { r01: [0.8, 6.87], r02: [8.6, 3.12], r03: [12.6, 4.18], r04: [18.4, 3.59], r05: [23.0, 3.09], r06: [27.0, 4.16], r07: [32.0, 1.55],
          r08: [34.4, 4.84], r09: [40.3, 3.61], r10: [44.8, 3.11], r11: [49.6, 1.97], r12: [52.5, 4.01], r13: [57.8, 4.58] };
        const S = { t1: 0, t2: 4.4, t3: 7.9, t4: 11.9, t5: 16.8, t6: 22.4, t7: 26.3, t8: 31.4, t9: 33.7, t10: 39.6, t11: 44.2, t12: 48.0, t13: 49.3, t14: 52.1, t15: 54.3, t16: 57.4 };
        // sahne geçişi: yeni sayfa eskisinin üstüne kayar
        Object.keys(S).slice(1).forEach((id) => tl.fromTo(document.getElementById(id).firstElementChild, { xPercent: 100 }, { xPercent: 0, duration: 0.32, ease: E.giris }, S[id]));
        // yavaş kamera hareketi
        const kam = (sec, t0, t1, a, b, org) => tl.fromTo(sec, { scale: a[0], x: a[1], y: a[2], transformOrigin: org }, { scale: b[0], x: b[1], y: b[2], duration: t1 - t0, ease: "sine.inOut", transformOrigin: org }, t0);
        // bir repliği parçalara bölüp sırayla gösterir; parça süreleri harf sayısıyla orantılı
        function metin(sahne, tur, konum, r, parcalar, sec = {}) {
          const [t0, sure] = R[r], top = parcalar.reduce((n, p) => n + p.replace(/<br>/g, " ").length, 0), ebeveyn = document.getElementById(sahne).firstElementChild;
          let birikim = sec.bas || 0; const toplam = sec.toplam || top;
          parcalar.forEach((p, i) => {
            const el = document.createElement("div");
            el.className = tur === "balon" ? "kn-balon" + (sec.fisilti ? " fisilti" : "") : "anlati";
            el.innerHTML = p + (tur === "balon" && sec.kuyruk ? `<i class="${sec.kuyruk}" style="left: ${sec.kuyrukX || 120}px"></i>` : "");
            Object.assign(el.style, { left: konum[0] + "px", top: konum[1] + "px" });
            if (tur === "balon") el.style.transformOrigin = sec.kuyruk === "ust" ? "20% 0%" : "20% 100%";
            ebeveyn.appendChild(el);
            const t = t0 + (sure * birikim) / toplam; birikim += p.replace(/<br>/g, " ").length;
            const son = i === parcalar.length - 1 ? (sec.bitis || t0 + sure + 0.7) : t0 + (sure * birikim) / toplam;
            if (tur === "balon") tl.fromTo(el, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: E.yay }, t - 0.08);
            else tl.fromTo(el, { clipPath: "inset(0% 100% 0% 0%)", opacity: 1 }, { clipPath: "inset(0% -3% 0% 0%)", duration: 0.32, ease: "power1.out" }, t - 0.05);
            tl.to(el, { opacity: 0, duration: 0.12, ease: "none" }, son - 0.12);
          });
        }

        const B = { kuyruk: "ust", kuyrukX: 110 }, bal = (o) => Object.assign({}, B, o || {});
        const ses = (sec, t, kal) => tl.fromTo(sec, { scale: 0.4, opacity: 0, rotation: 6 }, { scale: 1, opacity: 1, duration: 0.2, ease: E.yay }, t).to(sec, { opacity: 0, y: -30, duration: 0.3 }, t + kal);
        const M = "576 1001";
        ["t2", "t16"].forEach((p) => { gsap.set("#" + p + "-akrep", { rotation: 200, svgOrigin: M }); gsap.set("#" + p + "-yelkovan", { rotation: 240, svgOrigin: M }); });
        const tikla = (p, t0, adet, ilk) => { tl.fromTo("#" + p + "-saniye", { rotation: ilk, svgOrigin: M }, { rotation: ilk + 6, duration: 0.07, ease: "power4.out", svgOrigin: M }, t0);
          for (let k = 2; k <= adet; k++) tl.to("#" + p + "-saniye", { rotation: ilk + 6 * k, duration: 0.07, ease: "power4.out", svgOrigin: M }, t0 + k - 1); };

        // T1 — şafak, Mercan saatle (0. kare kapak)
        kam("#t1-resim", 0, 4.7, [1.0, 0, 0], [1.08, 0, 0], "47% 30%");
        tl.to("#t1-baslik", { opacity: 0, duration: 0.3 }, 0.5).to("#t1-kutu", { opacity: 0, duration: 0.3 }, 4.0);
        metin("t1", "anlati", [64, 1500], "r01", ["Gün ağarırken<br>Kuzguncuk'ta", "polis ışıkları<br>sönüyordu."], { toplam: 99, bitis: 4.45 });
        // T2 — avuçtaki saat hâlâ işliyor
        kam("#t2-resim", 4.4, 8.2, [1.03, 0, 0], [1.16, -30, -30], "53% 48%");
        tikla("t2", 4.8, 4, 0);
        ses("#t2-tik", 4.8, 0.75);
        metin("t2", "anlati", [64, 1430], "r01", ["Mercan'ın avucundaki<br>saat ise", "hâlâ işliyordu."], { toplam: 99, bas: 52, bitis: 8.0 });
        // T3 — Tarık saati ister
        kam("#t3-resim", 7.9, 12.2, [1.04, 0, 0], [1.14, 0, 0], "52% 25%");
        tl.fromTo("#t3-ad", { x: -520 }, { x: 0, duration: 0.35, ease: E.giris }, 8.3);
        metin("t3", "balon", [64, 1340], "r02", ["Doktor Hanım,<br>o saat delil.", "Bana vermeniz<br>gerekiyor."], bal({ bitis: 12.05 }));
        // T4 — Mercan kapağı zorlar
        kam("#t4-resim", 11.9, 17.1, [1.12, 0, 0], [1.3, 0, -60], "40% 45%");
        metin("t4", "balon", [64, 1340], "r03", ["Vereceğim Komiser.", "Ama önce içinde<br>ne olduğuna", "bakmam lazım."], bal({ bitis: 16.9 }));
        // T5 — es: kapak açılır, jeton avuca düşer
        kam("#t5-resim", 16.8, 22.7, [1.7, 0, 0], [1.12, 0, 0], "42% 38%");
        tl.fromTo("#t5-parla", { scale: 0.3, opacity: 0 }, { scale: 1.2, opacity: 1, duration: 0.16, ease: "power2.out" }, 17.6).to("#t5-parla", { opacity: 0, scale: 1.6, duration: 0.5, ease: "power1.out" }, 17.76);
        ses("#t5-ses", 17.6, 0.7);
        metin("t5", "anlati", [64, 1430], "r04", ["Kapağın altından küçük,", "pirinç bir vapur<br>jetonu düştü."], { bitis: 22.5 });
        // T6 — Poyraz
        kam("#t6-resim", 22.4, 26.6, [1.03, 0, 0], [1.15, 0, 0], "51% 27%");
        metin("t6", "balon", [64, 1340], "r05", ["Jeton mu?", "Abla bunlar yıllar<br>önce kalktı."], bal({ bitis: 26.4 }));
        // T7 — Feride Hanım
        kam("#t7-resim", 26.3, 31.7, [1.03, 0, 0], [1.14, 0, 0], "47% 26%");
        tl.fromTo("#t7-ad", { x: -520 }, { x: 0, duration: 0.35, ease: E.giris }, 26.7);
        metin("t7", "balon", [64, 1340], "r06", ["Yirmi yıl önce<br>kalktı evladım.", "Tam da o davanın<br>görüldüğü yıl."], bal({ bitis: 31.5 }));
        // T8 — Mercan sorar
        kam("#t8-resim", 31.4, 34.0, [1.6, 0, 0], [1.72, 0, 0], "47% 22%");
        metin("t8", "balon", [64, 1340], "r07", ["Hangi dava,<br>Feride Hanım?"], bal({ bitis: 33.85 }));
        // T9 — tanıklık
        kam("#t9-resim", 33.7, 39.9, [1.35, 0, 0], [1.6, 0, 0], "46% 22%");
        metin("t9", "balon", [64, 1340], "r08", ["Nazım'la beni<br>birbirine bağlayan", "tek şey.", "İkimiz de aynı<br>mahkemede tanıktık."], bal({ bitis: 39.75 }));
        // T10 — jetonun üstündeki saat
        kam("#t10-resim", 39.6, 44.5, [1.2, 0, 0], [2.0, 0, 0], "42% 38%");
        metin("t10", "balon", [64, 1340], "r09", ["Jetonun üstüne bir<br>saat kazınmış.", "Yedi on beş."], bal({ bitis: 44.35 }));
        // T11 — Poyraz: vapur
        kam("#t11-resim", 44.2, 48.3, [1.3, 0, 0], [1.42, 0, 0], "51% 24%");
        metin("t11", "balon", [64, 1340], "r10", ["Yedi on beş vapuru.", "Üsküdar iskelesinden<br>kalkıyor."], bal({ bitis: 48.1 }));
        // T12 — es: uzakta vapur düdüğü
        kam("#t12-resim", 48.0, 49.6, [1.25, 0, 0], [1.4, 0, 0], "65% 46%");
        ses("#t12-ses", 48.25, 0.95);
