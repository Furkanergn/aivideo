    <script>
      (function () {
        const E = window.REEL.egri, tl = gsap.timeline({ paused: true });
        // replik başlangıcı ve konuşma süresi (ses-miks-v2.py ile aynı)
        const R = { r01: [0.74, 4.38], r02: [7.35, 2.27], r03: [10.94, 2.88], r04: [14.94, 3.95], r05: [19.95, 5.07], r06: [26.27, 3.03], r07: [30.56, 3.18],
          r08: [35.09, 2.96], r09: [39.35, 3.85], r10: [47.09, 3.31], r11: [51.61, 2.85], r12: [55.83, 1.09], r13: [59.29, 4.19] };
        const S = { t1: 0, t2: 6.4, t3: 14, t4: 19.1, t5: 25.4, t6: 29.7, t7: 34.2, t8: 38.5, t9: 43.5, t10: 46.3, t11: 54.8, t12: 58.4 };
        // sahne geçişi: yeni sayfa eskisinin üstüne kayar
        Object.keys(S).slice(1).forEach((id) => tl.fromTo(document.getElementById(id).firstElementChild, { xPercent: 100 }, { xPercent: 0, duration: 0.32, ease: E.giris }, S[id]));
        // yavaş kamera hareketi
        const kam = (sec, t0, t1, a, b, org) => tl.fromTo(sec, { scale: a[0], x: a[1], y: a[2], transformOrigin: org }, { scale: b[0], x: b[1], y: b[2], duration: t1 - t0, ease: "sine.inOut", transformOrigin: org }, t0);
        // bir repliği parçalara bölüp sırayla gösterir; parça süreleri harf sayısıyla orantılı
        function metin(sahne, tur, konum, r, parcalar, sec = {}) {
          const [t0, sure] = R[r], top = parcalar.reduce((n, p) => n + p.replace(/<br>/g, " ").length, 0), ebeveyn = document.getElementById(sahne).firstElementChild;
          let birikim = sec.bas || 0; const toplam = sec.toplam || top;
          parcalar.forEach((p, i) => {
            const el = document.createElement("div");
            el.className = tur === "balon" ? "kn-balon" + (sec.fisilti ? " fisilti" : "") : "anlati";
            el.innerHTML = p + (tur === "balon" && sec.kuyruk ? `<i class="${sec.kuyruk}" style="left: ${sec.kuyrukX || 120}px"></i>` : "");
            Object.assign(el.style, { left: konum[0] + "px", top: konum[1] + "px" });
            if (tur === "balon") el.style.transformOrigin = sec.kuyruk === "ust" ? "20% 0%" : "20% 100%";
            ebeveyn.appendChild(el);
            const t = t0 + (sure * birikim) / toplam; birikim += p.replace(/<br>/g, " ").length;
            const son = i === parcalar.length - 1 ? (sec.bitis || t0 + sure + 0.7) : t0 + (sure * birikim) / toplam;
            if (tur === "balon") tl.fromTo(el, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: E.yay }, t - 0.08);
            else tl.fromTo(el, { clipPath: "inset(0% 100% 0% 0%)", opacity: 1 }, { clipPath: "inset(0% -3% 0% 0%)", duration: 0.32, ease: "power1.out" }, t - 0.05);
            tl.to(el, { opacity: 0, duration: 0.12, ease: "none" }, son - 0.12);
          });
        }

        // T1 — işleyen saat (0. kare kapak)
        const M = "555 822";
        gsap.set("#t1-akrep", { rotation: 140, svgOrigin: M }); gsap.set("#t1-yelkovan", { rotation: 240, svgOrigin: M });
        kam("#t1-resim", 0, 6.7, [1.3, -20, -40], [1.42, -20, -40], "51% 43%");
        tl.fromTo("#t1-saniye", { rotation: 108, svgOrigin: M }, { rotation: 114, duration: 0.07, ease: "power4.out", svgOrigin: M }, 0.3);
        for (let k = 2; k <= 6; k++) tl.to("#t1-saniye", { rotation: 108 + 6 * k, duration: 0.07, ease: "power4.out", svgOrigin: M }, k - 0.7);
        tl.to("#t1-baslik", { opacity: 0, duration: 0.3 }, 0.45).to("#t1-kutu", { opacity: 0, duration: 0.3 }, 5.9)
          .fromTo("#t1-tik", { scale: 0, opacity: 0, rotation: 8 }, { scale: 1, opacity: 1, duration: 0.16, ease: E.yay }, 2.3).to("#t1-tik", { opacity: 0, y: -30, duration: 0.3 }, 3.05);
        metin("t1", "anlati", [64, 1380], "r01", ["Saat işliyordu.", "Her tıkırtı, birinin<br>kalan vaktinden düşüyordu."], { bitis: 5.9 });
        // T2 — arka kapak, kâğıt; es: Mercan saati çevirir, sonra Poyraz okur
        kam("#t2-resim", 6.4, 14.3, [1.03, 0, 0], [1.26, -70, 60], "60% 30%");
        metin("t2", "balon", [64, 1330], "r02", ["Saatin arka kapağında<br>bir şey var."], { bitis: 10.3 });
        tl.fromTo("#t2-ek", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: E.yay }, 10.7);
        metin("t2", "balon", [450, 1250], "r03", ["Beş otuz... F.<br>Bu kadar mı?"], { bitis: 14.2 });
        // T3 — Emre defteri gösterir
        kam("#t3-resim", 14, 19.4, [1.03, 0, 0], [1.15, 0, -30], "62% 40%");
        metin("t3", "balon", [64, 290], "r04", ["Bu saati tanıyorum.", "Ustam geçen ay<br>tamir etti.", "Defterde yazar."], { kuyruk: "alt", kuyrukX: 110 });
        // T4 — defter sayfası: altı saat, altı "S."
        kam("#t4-resim", 19.1, 25.7, [1.02, 0, 0], [1.12, -30, 0], "70% 50%");
        tl.fromTo("#t4-isaret", { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 22.6);
        metin("t4", "anlati", [64, 1420], "r05", ["Defterin son sayfasında<br>altı saat vardı.", "Altısını da aynı adam<br>getirmişti."], { bitis: 25.5 });
        // T5 — Emre: ikinci saat kimin
        kam("#t5-resim", 25.4, 30, [1.03, 0, 0], [1.14, 0, 0], "50% 30%");
        metin("t5", "balon", [64, 1300], "r06", ["İkinci saat...", "Feride Hanım.<br>Kuzguncuk."], { kuyruk: "ust", kuyrukX: 110 });
        // T6 — Mercan süreyi söyler
        kam("#t6-resim", 29.7, 34.5, [1.03, 0, 0], [1.16, 0, 0], "70% 28%");
        metin("t6", "balon", [64, 1300], "r07", ["Şimdi beşe yirmi var.", "Elli dakikamız kaldı."], { kuyruk: "ust", kuyrukX: 110 });
        // T7 — Poyraz hazır
        kam("#t7-resim", 34.2, 38.8, [1.16, 0, 0], [1.04, 0, 0], "50% 26%");
        metin("t7", "balon", [64, 1300], "r08", ["Motor aşağıda.", "Köprüyü on beş<br>dakikada geçerim."], { kuyruk: "ust", kuyrukX: 110 });
        // T8 — Mercan Emre'ye
        kam("#t8-resim", 38.5, 43.8, [1.04, 0, 0], [1.16, 0, 0], "52% 20%");
        metin("t8", "balon", [64, 1300], "r09", ["Emre, sen burada kal.", "Polisi ara, kimseye<br>kapıyı açma."], { kuyruk: "ust", kuyrukX: 110 });
        // T9 — es: köprüde motor
        kam("#t9-resim", 43.5, 46.6, [1.3, 0, 120], [1.05, 0, 0], "45% 55%");
        tl.fromTo("#t9-vrm", { scale: 0.4, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, duration: 0.2, ease: E.yay }, 43.9)
          .fromTo("#t9-vrm", { x: 0 }, { x: 10, duration: 0.05, repeat: 29, yoyo: true, ease: "none" }, 44.0)
          .fromTo("#t9-resim img", { x: 0 }, { x: 6, duration: 0.05, repeat: 49, yoyo: true, ease: "none" }, 43.6);
        // T10 — Kuzguncuk: kapı aralık, ışık yanıyor
        kam("#t10-resim", 46.3, 55.1, [1.03, 0, 0], [1.3, 0, -60], "55% 62%");
        tl.fromTo("#t10-ad", { x: -520 }, { x: 0, duration: 0.35, ease: E.giris }, 46.8).to("#t10-ad", { opacity: 0, duration: 0.2 }, 50.6);
        metin("t10", "anlati", [64, 1380], "r10", ["Kuzguncuk'a<br>vardıklarında", "saat beşi on<br>geçiyordu."], { bitis: 50.9 });
        tl.fromTo("#t10-ek", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: E.yay }, 51.3);
        metin("t10", "balon", [450, 1250], "r11", ["Abla... kapı<br>aralık.", "Işık yanıyor."], { fisilti: true, bitis: 55.0 });
        // T11 — Mercan kapıda
        kam("#t11-resim", 54.8, 58.7, [1.03, 0, 0], [1.14, 0, 0], "72% 26%");
        metin("t11", "balon", [64, 1300], "r12", ["Balat'taki gibi."], { kuyruk: "ust", kuyrukX: 110, bitis: 58.3 });
        // T12 — kapanış
