        const E = window.REEL.egri, tl = gsap.timeline({ paused: true });

        const S = { t1: 0, t2: 7.3, t3: 17.0, t4: 23.9, t5: 27.8, t6: 31.5, t7: 36.8, t8: 42.3, t9: 44.9, t10: 51.7, t11: 54.3, t12: 60.8 };

        Object.keys(S).slice(1).forEach((id) => tl.fromTo(document.getElementById(id).firstElementChild, { xPercent: 100 }, { xPercent: 0, duration: 0.32, ease: E.giris }, S[id]));

        const kam = (sec, t0, t1, a, b, org) => tl.fromTo(sec, { scale: a[0], x: a[1], y: a[2], transformOrigin: org }, { scale: b[0], x: b[1], y: b[2], duration: t1 - t0, ease: "sine.inOut", transformOrigin: org }, t0);

          const [t0, sure] = R[r], top = parcalar.reduce((n, p) => n + p.replace(/<br>/g, " ").length, 0), ebeveyn = document.getElementById(sahne).firstElementChild;
          let birikim = sec.bas || 0; const toplam = sec.toplam || top;
          parcalar.forEach((p, i) => {
            const el = document.createElement("div");
            el.className = tur === "balon" ? "kn-balon" + (sec.fisilti ? " fisilti" : "") : "anlati";
            el.innerHTML = p + (tur === "balon" && sec.kuyruk ? `<i class="${sec.kuyruk}" style="left: ${sec.kuyrukX || 120}px"></i>` : "");
            Object.assign(el.style, { left: konum[0] + "px", top: konum[1] + "px" });
            if (tur === "balon") el.style.transformOrigin = sec.kuyruk === "ust" ? "20% 0%" : "20% 100%";
            ebeveyn.appendChild(el);
            const t = t0 + (sure * birikim) / toplam; birikim += p.replace(/<br>/g, " ").length;
            const son = i === parcalar.length - 1 ? (sec.bitis || t0 + sure + 0.7) : t0 + (sure * birikim) / toplam;

            tl.to(el, { opacity: 0, duration: 0.12, ease: "none" }, son - 0.12);
          });
        }
        const B = { kuyruk: "ust", kuyrukX: 110 };

        metin("t1", "anlati", [64, 1590], "r01", ["Yedi on beş vapuru", "iskeleden ayrılırken", "Boğaz'ın üstünde<br>sis vardı."], { bitis: 5.4 });

        // T2 — kalabalık güverte; 3. replikten sonra kamera yolcuları tarar

        // T4 — Mercan sıraların arasından yaklaşır
        kam("#t4-resim", 23.9, 28.1, [1.02, 0, 0], [1.2, 0, 0], "45% 22%");
        metin("t4", "balon", [64, 1300], "r05", ["Affedersiniz.", "Birini mi<br>bekliyorsunuz?"], B);
        // T5 — Rıfat Bey
        kam("#t5-resim", 27.8, 31.8, [1.5, 0, 0], [1.62, 0, 0], "38% 16%");
        metin("t5", "balon", [64, 1300], "r06", ["Yirmi yıldır<br>bekliyorum.", "Oturun lütfen."], B);
        // T6 — 3/6 saati
        const M = "576 1001";
        ["t6", "t12"].forEach((p) => { gsap.set("#" + p + "-akrep", { rotation: 218, svgOrigin: M }); gsap.set("#" + p + "-yelkovan", { rotation: 96, svgOrigin: M }); });
        kam("#t6-resim", 31.5, 37.1, [1.03, 0, 0], [1.2, -30, -40], "53% 48%");
        tl.fromTo("#t6-saniye", { rotation: 0, svgOrigin: M }, { rotation: 6, duration: 0.07, ease: "power4.out", svgOrigin: M }, 32.0);
        for (let k = 2; k <= 6; k++) tl.to("#t6-saniye", { rotation: 6 * k, duration: 0.07, ease: "power4.out", svgOrigin: M }, 31.0 + k);
        tl.fromTo("#t6-tik", { scale: 0, opacity: 0, rotation: 8 }, { scale: 1, opacity: 1, duration: 0.16, ease: E.yay }, 31.9).to("#t6-tik", { opacity: 0, y: -30, duration: 0.3 }, 32.7);
