        // bir repliği parçalara bölüp sırayla gösterir; parça süreleri harf sayısıyla orantılı

        metin("u5", "anlati", [64, 300], "r05", ["İskeleye inen<br>kalabalığın içinde", "sarı bir kurye çantası<br>hızla uzaklaşıyordu."], { bitis: 23.5 });

        kam("#u6-resim", 24.0, 27.1, [1.18, 0, 0], [1.05, 0, 0], "40% 30%");
        tl.fromTo("#u6-resim", { rotation: -1.2 }, { rotation: 1.2, duration: 0.09, ease: "none", repeat: 5, yoyo: true }, 24.7).set("#u6-resim", { rotation: 0 }, 25.3);

        // U7 — Mercan hâkimin yanında kalır

        tl.fromTo("#u9-ses", { scale: 0.4, opacity: 0, rotation: -6 }, { scale: 1, opacity: 1, duration: 0.2, ease: E.yay }, 36.4).to("#u9-ses", { x: 14, duration: 0.11, ease: "none", repeat: 5, yoyo: true }, 36.6).to("#u9-ses", { opacity: 0, y: -30, duration: 0.25 }, 37.3);

        // U10 — paket düşer, dördüncü saat
        const M = "567 966";
        ["u10", "u11", "u13"].forEach((p) => { gsap.set("#" + p + "-akrep", { rotation: 235, svgOrigin: M }); gsap.set("#" + p + "-yelkovan", { rotation: 80, svgOrigin: M }); });
