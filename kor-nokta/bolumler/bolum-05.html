    <script>
      (function () {
        const E = window.REEL.egri, tl = gsap.timeline({ paused: true });
        // replik başlangıcı ve konuşma süresi (ses-miks-b05.py ile aynı)
        const R = { r01: [0.85, 3.96], r02: [6.95, 4.82], r03: [13.34, 3.58], r04: [18.12, 1.48], r05: [21.0, 3.91], r06: [27.24, 3.43], r07: [32.45, 3.64],
          r08: [37.75, 1.85], r09: [40.55, 3.05], r10: [44.61, 3.18], r11: [49.68, 5.32], r12: [56.24, 0.93], r13: [59.84, 7.37] };
        const S = { t1: 0, t2: 6.0, t3: 12.2, t4: 17.4, t5: 20.1, t6: 25.7, t7: 31.4, t8: 37.0, t9: 39.7, t10: 48.4, t11: 52.3, t12: 58.8 };
        // sahne geçişi: yeni sayfa eskisinin üstüne kayar
        Object.keys(S).slice(1).forEach((id) => tl.fromTo(document.getElementById(id).firstElementChild, { xPercent: 100 }, { xPercent: 0, duration: 0.32, ease: E.giris }, S[id]));
        // yavaş kamera hareketi
        const kam = (sec, t0, t1, a, b, org) => tl.fromTo(sec, { scale: a[0], x: a[1], y: a[2], transformOrigin: org }, { scale: b[0], x: b[1], y: b[2], duration: t1 - t0, ease: "sine.inOut", transformOrigin: org }, t0);
        // bir repliği parçalara bölüp sırayla gösterir; parça süreleri harf sayısıyla orantılı
        function metin(sahne, tur, konum, r, parcalar, sec = {}) {
          const [t0, sure] = R[r], top = parcalar.reduce((n, p) => n + p.replace(/<br>/g, " ").length, 0), ebeveyn = document.getElementById(sahne).firstElementChild;
          let birikim = sec.bas || 0; const toplam = sec.toplam || top;
          parcalar.forEach((p, i) => {
            const el = document.createElement("div");
            el.className = tur === "balon" ? "kn-balon" + (sec.fisilti ? " fisilti" : "") : "anlati";
            el.innerHTML = p + (tur === "balon" && sec.kuyruk ? `<i class="${sec.kuyruk}" style="left: ${sec.kuyrukX || 120}px"></i>` : "");
            Object.assign(el.style, { left: konum[0] + "px", top: konum[1] + "px" });
            if (tur === "balon") el.style.transformOrigin = sec.kuyruk === "ust" ? "20% 0%" : "20% 100%";
            ebeveyn.appendChild(el);
            const t = t0 + (sure * birikim) / toplam; birikim += p.replace(/<br>/g, " ").length;
            const son = i === parcalar.length - 1 ? (sec.bitis || t0 + sure + 0.7) : t0 + (sure * birikim) / toplam;
            if (tur === "balon") tl.fromTo(el, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: E.yay }, t - 0.08);
            else tl.fromTo(el, { clipPath: "inset(0% 100% 0% 0%)", opacity: 1 }, { clipPath: "inset(0% -3% 0% 0%)", duration: 0.32, ease: "power1.out" }, t - 0.05);
            tl.to(el, { opacity: 0, duration: 0.12, ease: "none" }, son - 0.12);
          });
        }

        // T1 — Sami ışığa çıkar (0. kare kapak)
        kam("#t1-resim", 0, 6.3, [1.0, 0, 0], [1.05, 0, 0], "50% 40%");
        tl.to("#t1-baslik", { opacity: 0, duration: 0.3 }, 0.5).to("#t1-kutu", { opacity: 0, duration: 0.3 }, 5.6);
        metin("t1", "anlati", [64, 1590], "r01", ["Adam ışığa bir adım attı.", "Sol ayağı arkasından", "sürükleniyordu."], { bitis: 5.75 });
        // T2 — Mercan adını koyar
        kam("#t2-resim", 6.0, 12.5, [1.04, 0, 0], [1.16, 0, 0], "55% 26%");
        metin("t2", "balon", [64, 1290], "r02", ["Sami Bey.", "Nazım Bey'in<br>eski ortağı.", "Defterdeki S.<br>sizsiniz."], { kuyruk: "ust", kuyrukX: 110 });
        // T3 — Sami
        kam("#t3-resim", 12.2, 17.7, [1.03, 0, 0], [1.14, 0, 0], "52% 36%");
        tl.fromTo("#t3-ad", { x: -420 }, { x: 0, duration: 0.35, ease: E.giris }, 12.7);
        metin("t3", "balon", [64, 1340], "r03", ["Ortağıydım.", "Yirmi yıl önce beni", "dükkândan o kovdu."], { kuyruk: "ust", kuyrukX: 110 });
        // T4 — Mercan sorar
        kam("#t4-resim", 17.4, 20.4, [1.7, 0, 0], [1.85, 0, 0], "50% 20%");
        metin("t4", "balon", [64, 1300], "r04", ["Bu yüzden mi<br>öldürdünüz?"], { kuyruk: "ust", kuyrukX: 110, bitis: 20.2 });
        // T5 — Sami reddeder
        kam("#t5-resim", 20.1, 26.0, [1.55, 0, 0], [1.72, 0, 0], "58% 10%");
        metin("t5", "balon", [64, 1300], "r05", ["Ben kimseyi<br>öldürmedim.", "Ben yalnızca<br>saatleri dağıtırım."], { kuyruk: "ust", kuyrukX: 110, bitis: 25.5 });
        // T6 — kiler: Feride Hanım yaşıyor
        kam("#t6-resim", 25.7, 31.7, [1.16, 0, 0], [1.03, 0, 0], "70% 50%");
        tl.fromTo("#t6-ses", { scale: 0.4, opacity: 0, rotation: 6 }, { scale: 1, opacity: 1, duration: 0.2, ease: E.yay }, 25.85).to("#t6-ses", { opacity: 0, y: -30, duration: 0.3 }, 26.9);
        metin("t6", "balon", [64, 1340], "r06", ["Abla, kilerde<br>biri var!", "Feride Hanım burada,", "yaşıyor!"], { kuyruk: "ust", kuyrukX: 110 });
        // T7 — polis
        kam("#t7-resim", 31.4, 37.3, [1.04, 0, 0], [1.22, 0, 0], "42% 52%");
        tl.fromTo("#t7-flas", { opacity: 0.15 }, { opacity: 1, duration: 0.35, ease: "sine.inOut", repeat: 15, yoyo: true }, 31.4);
        metin("t7", "anlati", [64, 300], "r07", ["Saat beş otuzu<br>gösterdiğinde,", "sokağa polis<br>sirenleri doldu."], { bitis: 36.9 });
        // T8 — asıl soru
        kam("#t8-resim", 37.0, 40.0, [1.5, 0, 0], [1.62, 0, 0], "50% 18%");
        metin("t8", "balon", [64, 1300], "r08", ["Saatleri kim kuruyor,<br>Sami Bey?"], { kuyruk: "ust", kuyrukX: 110, bitis: 39.85 });
        // T9 — Saatçi
        kam("#t9-resim", 39.7, 48.7, [1.05, 0, 0], [1.3, 0, 0], "52% 36%");
        metin("t9", "balon", [64, 1340], "r09", ["Ona Saatçi derler.", "Yüzünü ben bile<br>görmedim."], { kuyruk: "ust", kuyrukX: 110, bitis: 44.3 });
        metin("t9", "balon", [64, 1340], "r10", ["Ama sizi o seçti,<br>Mercan Hanım.", "İlk günden beri."], { kuyruk: "ust", kuyrukX: 110, bitis: 48.5 });
        // T10 — cepten çıkan saat
        kam("#t10-resim", 48.4, 52.6, [1.03, 0, 0], [1.18, -40, 0], "75% 35%");
        metin("t10", "anlati", [64, 300], "r11", ["Sami'nin cebinden<br>üçüncü bir saat çıktı."], { toplam: 82, bitis: 52.45 });
        // T11 — 3/6 işliyor
        const M = "576 1001";
        ["t11", "t12"].forEach((p) => { gsap.set("#" + p + "-akrep", { rotation: 167.5, svgOrigin: M }); gsap.set("#" + p + "-yelkovan", { rotation: 210, svgOrigin: M }); });
        kam("#t11-resim", 52.3, 59.1, [1.03, 0, 0], [1.22, -30, -40], "53% 48%");
        tl.fromTo("#t11-saniye", { rotation: 0, svgOrigin: M }, { rotation: 6, duration: 0.07, ease: "power4.out", svgOrigin: M }, 52.9);
        for (let k = 2; k <= 6; k++) tl.to("#t11-saniye", { rotation: 6 * k, duration: 0.07, ease: "power4.out", svgOrigin: M }, 51.9 + k);
        tl.fromTo("#t11-tik", { scale: 0, opacity: 0, rotation: 8 }, { scale: 1, opacity: 1, duration: 0.16, ease: E.yay }, 52.9).to("#t11-tik", { opacity: 0, y: -30, duration: 0.3 }, 53.65);
        metin("t11", "anlati", [64, 1430], "r11", ["Kapağında üç bölü altı<br>yazıyordu."], { toplam: 82, bas: 43, bitis: 55.6 });
        metin("t11", "balon", [64, 1430], "r12", ["Bu da işliyor."], { kuyruk: "ust", kuyrukX: 110, bitis: 58.7 });
        // T12 — kapanış: üçüncü saat işlemeye devam eder
