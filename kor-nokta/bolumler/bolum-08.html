    <script>
      (function () {
        const E = window.REEL.egri, tl = gsap.timeline({ paused: true });
        // replik başlangıcı ve konuşma süresi (ses-miks-b08.py ile aynı)
        const R = { r01: [0.8, 5.09], r02: [7.3, 5.94], r03: [14.4, 6.17], r04: [22.0, 2.44], r05: [25.59, 3.37], r06: [30.3, 4.67], r07: [37.5, 3.85],

        const S = { t1: 0, t2: 6.5, t3: 13.7, t4: 21.3, t5: 24.9, t6: 29.5, t7: 32.0, t8: 36.9, t9: 41.9, t10: 46.3, t11: 50.0, t12: 52.2, t13: 58.0, t14: 63.4 };
        // sahne geçişi: yeni sayfa eskisinin üstüne kayar
        Object.keys(S).slice(1).forEach((id) => tl.fromTo(document.getElementById(id).firstElementChild, { xPercent: 100 }, { xPercent: 0, duration: 0.32, ease: E.giris }, S[id]));
        // yavaş kamera hareketi
        const kam = (sec, t0, t1, a, b, org) => tl.fromTo(sec, { scale: a[0], x: a[1], y: a[2], transformOrigin: org }, { scale: b[0], x: b[1], y: b[2], duration: t1 - t0, ease: "sine.inOut", transformOrigin: org }, t0);
        // bir repliği parçalara bölüp sırayla gösterir; parça süreleri harf sayısıyla orantılı
        function metin(sahne, tur, konum, r, parcalar, sec = {}) {
          const [t0, sure] = R[r], top = parcalar.reduce((n, p) => n + p.replace(/<br>/g, " ").length, 0), ebeveyn = document.getElementById(sahne).firstElementChild;
          let birikim = sec.bas || 0; const toplam = sec.toplam || top;
          parcalar.forEach((p, i) => {
            const el = document.createElement("div");
            el.className = tur === "balon" ? "kn-balon" + (sec.fisilti ? " fisilti" : "") : "anlati";
            el.innerHTML = p + (tur === "balon" && sec.kuyruk ? `<i class="${sec.kuyruk}" style="left: ${sec.kuyrukX || 120}px"></i>` : "");
            Object.assign(el.style, { left: konum[0] + "px", top: konum[1] + "px" });
            if (tur === "balon") el.style.transformOrigin = sec.kuyruk === "ust" ? "20% 0%" : "20% 100%";
            ebeveyn.appendChild(el);
            const t = t0 + (sure * birikim) / toplam; birikim += p.replace(/<br>/g, " ").length;
            const son = i === parcalar.length - 1 ? (sec.bitis || t0 + sure + 0.7) : t0 + (sure * birikim) / toplam;
            if (tur === "balon") tl.fromTo(el, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: E.yay }, t - 0.08);
            else tl.fromTo(el, { clipPath: "inset(0% 100% 0% 0%)", opacity: 1 }, { clipPath: "inset(0% -3% 0% 0%)", duration: 0.32, ease: "power1.out" }, t - 0.05);
            tl.to(el, { opacity: 0, duration: 0.12, ease: "none" }, son - 0.12);
          });
        }
        const B = { kuyruk: "ust", kuyrukX: 110 };
        // T1 — vapur Boğaz'ın ortasında (0. kare kapak)
        kam("#t1-resim", 0, 6.8, [1.0, 0, 0], [1.1, 0, 0], "52% 42%");
        tl.to("#t1-baslik", { opacity: 0, duration: 0.3 }, 0.5).to("#t1-kutu", { opacity: 0, duration: 0.3 }, 6.0);
        metin("t1", "anlati", [64, 1560], "r01", ["Vapur Boğaz'ın<br>ortasındaydı.", "Dönüş yoktu,", "iskeleye on iki<br>dakika vardı."], { bitis: 6.3 });
        // T2 — Mercan anlatır
        kam("#t2-resim", 6.5, 14.0, [1.03, 0, 0], [1.15, 0, 0], "35% 24%");
        metin("t2", "balon", [64, 1490], "r02", ["Yirmi yıl önce<br>bir çırak,", "ustasının dükkânında<br>ölü bulundu.", "Ölüm saatini<br>ben belirledim."], B);
        // T3 — Rıfat Bey
        kam("#t3-resim", 13.7, 21.6, [1.03, 0, 0], [1.16, 0, 0], "38% 21%");
        tl.fromTo("#t3-ad", { x: -700 }, { x: 0, duration: 0.35, ease: E.giris }, 14.2);
        metin("t3", "balon", [64, 1400], "r03", ["Sizin raporunuz,", "Nazım'ın<br>bilirkişiliği,", "Feride Hanım'ın<br>tanıklığı.", "Kenan Usta'yı bunlarla<br>mahkûm ettik."], B);
        // T4 — Poyraz
        kam("#t4-resim", 21.3, 25.2, [1.5, 0, 0], [1.62, 0, 0], "50% 27%");
        metin("t4", "balon", [64, 1340], "r04", ["O zaman Saatçi,<br>Kenan Usta mı?"], { ...B, bitis: 24.8 });
        // T5 — Rıfat Bey yakın
        kam("#t5-resim", 24.9, 29.8, [1.45, 0, 0], [1.6, 0, 0], "38% 21%");
        metin("t5", "balon", [64, 1340], "r05", ["Kenan Usta<br>beş yıl önce", "cezaevinde öldü<br>evladım."], { ...B, bitis: 29.4 });
        // T6 — Mercan
        kam("#t6-resim", 29.5, 32.3, [1.5, 0, 0], [1.6, 0, 0], "35% 24%");
        metin("t6", "balon", [64, 1340], "r06", ["Ama bir çocuğu vardı."], { ...B, toplam: 62, bitis: 32.0 });
        // T7 — boş duruşma salonu, arka sırada çocuk; ardından sessizlik
        kam("#t7-resim", 32.0, 37.2, [1.0, 0, 0], [1.55, 0, 0], "64% 30%");
        metin("t7", "balon", [64, 1400], "r06", ["Duruşmalarda hep", "en arka sırada<br>otururdu."], { toplam: 62, bas: 21, bitis: 35.5 });
        // T8 — çaycı bardağı bırakır
        kam("#t8-resim", 36.9, 42.2, [1.03, 0, 0], [1.3, 0, 0], "48% 70%");
        metin("t8", "anlati", [64, 1590], "r07", ["Tam o sırada çaycı,", "hâkimin önüne taze<br>bir bardak bıraktı."], { bitis: 41.7 });
        tl.fromTo("#t8-tik", { scale: 0, opacity: 0, rotation: 8 }, { scale: 1, opacity: 1, duration: 0.16, ease: E.yay }, 41.78).to("#t8-tik", { opacity: 0, duration: 0.15 }, 42.1);
        // T9 — çaycı konuşur
        kam("#t9-resim", 41.9, 46.6, [1.3, 0, 0], [1.42, 0, 0], "57% 21%");
        tl.fromTo("#t9-ad", { x: -420 }, { x: 0, duration: 0.35, ease: E.giris }, 42.3);
        metin("t9", "balon", [64, 1340], "r08", ["Bu sizin beyefendi.", "Bir bey ısmarladı,<br>parası ödendi."], { ...B, bitis: 46.2 });
        // T10 — Rıfat Bey bardağı kaldırır
        kam("#t10-resim", 46.3, 50.3, [1.05, 0, 0], [1.3, 0, 0], "55% 36%");
        metin("t10", "balon", [64, 1400], "r09", ["Ne incelik.", "Soğuyanı hiç<br>sevmem."], { ...B, bitis: 49.9 });
        // T11 — "İçmeyin!": Mercan bardağa vurur, bardak güvertede kırılır
        kam("#t11-resim", 50.0, 52.5, [1.25, 0, 0], [1.06, 0, 0], "50% 30%");
        metin("t11", "balon", [64, 1500], "r10", ["İçmeyin!"], { ...B, bitis: 51.9 });
        tl.fromTo("#t11-ses", { scale: 0.4, opacity: 0, rotation: -6 }, { scale: 1, opacity: 1, duration: 0.18, ease: E.yay }, 50.93).to("#t11-ses", { opacity: 0, duration: 0.2 }, 52.0);
        [[-22, 14], [18, -12], [-12, 8], [8, -5], [0, 0]].forEach((p, i) => tl.to("#t11 .sayfa", { x: p[0], y: p[1], duration: 0.05, ease: "none" }, 50.93 + i * 0.05));
        // T12 — kırık bardak, kabaran boya
        kam("#t12-resim", 52.2, 58.3, [1.03, 0, 0], [1.24, 0, 0], "49% 37%");
        metin("t12", "anlati", [64, 1560], "r11", ["Bardak güverteye düştü.", "Çayın döküldüğü yerde", "boya kabarmaya başladı."], { bitis: 57.8 });
